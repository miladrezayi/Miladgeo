name: Build Geomatic Pro

on:
  workflow_dispatch:

  push:
    paths:
      - '**/*.html'
      - '**/*.jpg'
      - '**/*.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. دریافت فایل‌های Repository
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Gradle
      # ==========================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ==========================================
      # 4. ساخت ساختار پروژه Android
      # ==========================================
      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/miladgeo/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable


          # ======================================
          # فایل اصلی چندزبانه برنامه
          # ======================================

          cp index109_multilang.html \
             app/src/main/assets/index.html


          # ======================================
          # آیکون برنامه
          # ======================================

          cp miladgeo-icon.jpg \
             app/src/main/res/drawable/miladgeo_icon.jpg


      # ==========================================
      # 5. settings.gradle
      # ==========================================
      - name: Create settings.gradle
        run: |

          cat > settings.gradle <<'EOF'

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GeomaticPro"

          include(":app")

          EOF


      # ==========================================
      # 6. Root build.gradle
      # ==========================================
      - name: Create root build.gradle
        run: |

          cat > build.gradle <<'EOF'

          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }

          EOF


      # ==========================================
      # 7. app/build.gradle
      # ==========================================
      - name: Create app build.gradle
        run: |

          cat > app/build.gradle <<'EOF'

          plugins {
              id 'com.android.application'
          }

          android {

              namespace 'com.miladgeo.app'

              compileSdk 36


              defaultConfig {

                  applicationId 'com.miladgeo.app'

                  minSdk 23

                  targetSdk 36

                  versionCode 1

                  versionName '1.0'
              }


              buildTypes {

                  release {

                      minifyEnabled false

                      shrinkResources false
                  }
              }
          }

          EOF


      # ==========================================
      # 8. AndroidManifest.xml
      # ==========================================
      - name: Create AndroidManifest.xml
        run: |

          cat > app/src/main/AndroidManifest.xml <<'EOF'

          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">


              <uses-permission
                  android:name="android.permission.INTERNET" />


              <application

                  android:allowBackup="true"

                  android:label="Geomatic Pro"

                  android:icon="@drawable/miladgeo_icon"

                  android:roundIcon="@drawable/miladgeo_icon"

                  android:theme="@android:style/Theme.Material.Light.NoActionBar"

                  android:usesCleartextTraffic="true">


                  <activity

                      android:name=".MainActivity"

                      android:screenOrientation="portrait"

                      android:exported="true">


                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>


                  </activity>

              </application>

          </manifest>

          EOF


      # ==========================================
      # 9. MainActivity.java
      # ==========================================
      - name: Create MainActivity.java
        run: |

          cat > app/src/main/java/com/miladgeo/app/MainActivity.java <<'EOF'

          package com.miladgeo.app;


          import android.app.Activity;
          import android.os.Bundle;

          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import android.content.Intent;
          import android.net.Uri;


          public class MainActivity extends Activity {


              private WebView webView;


              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);


                  webView = new WebView(this);

                  setContentView(webView);


                  WebSettings settings =
                          webView.getSettings();


                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  settings.setLoadWithOverviewMode(false);

                  settings.setUseWideViewPort(false);


                  webView.setWebViewClient(
                          new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {


                          if (
                              url.startsWith("http://") ||
                              url.startsWith("https://") ||
                              url.startsWith("tg://") ||
                              url.startsWith("mailto:")
                          ) {

                              try {

                                  Intent intent =
                                          new Intent(
                                              Intent.ACTION_VIEW
                                          );

                                  intent.setData(
                                      Uri.parse(url)
                                  );

                                  startActivity(intent);

                                  return true;

                              } catch (Exception e) {

                                  return false;
                              }
                          }


                          return false;
                      }

                  });


                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }


              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }
          }

          EOF


      # ==========================================
      # 10. بررسی فایل‌ها قبل از Build
      # ==========================================
      - name: Verify project files
        run: |

          echo "Checking Android project..."

          test -f index109_multilang.html

          test -f miladgeo-icon.jpg

          test -f app/src/main/assets/index.html

          test -f app/src/main/res/drawable/miladgeo_icon.jpg

          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/com/miladgeo/app/MainActivity.java

          echo "All required files exist."

          echo "Source HTML:"
          ls -lh index109_multilang.html

          echo "Android asset:"
          ls -lh app/src/main/assets/index.html


      # ==========================================
      # 11. ساخت AAB Release
      # ==========================================
      - name: Build Release AAB
        run: |

          gradle bundleRelease --stacktrace


      # ==========================================
      # 12. بررسی AAB ساخته‌شده
      # ==========================================
      - name: Verify AAB
        run: |

          echo "Checking generated AAB..."

          test -f app/build/outputs/bundle/release/app-release.aab

          ls -lh app/build/outputs/bundle/release/app-release.aab

          echo "AAB successfully created."


      # ==========================================
      # 13. ذخیره AAB به عنوان Artifact
      # ==========================================
      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4

        with:

          name: Geomatic-Pro-GooglePlay-AAB

          path: app/build/outputs/bundle/release/app-release.aab

          if-no-files-found: error

          retention-days: 7

name: Build Geomatic Pro

on:
  workflow_dispatch:

  push:
    paths:
      - '**/*.html'
      - '**/*.jpg'
      - '**/*.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > geomatic-pro-upload.jks
          test -s geomatic-pro-upload.jks
          echo "Keystore restored successfully."


      - name: Create Android project
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          mkdir -p app/src/main/java/com/miladgeo/app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable


          cp index109_multilang.html app/src/main/assets/index.html

          cp miladgeo-icon.jpg app/src/main/res/drawable/miladgeo_icon.jpg


          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GeomaticPro"
          include(":app")
          EOF


          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          cat > gradle.properties <<'EOF'
          android.suppressUnsupportedCompileSdk=36
          EOF


          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.miladgeo.app'

              compileSdk 36

              defaultConfig {
                  applicationId 'com.miladgeo.app'
                  minSdk 23
                  targetSdk 36
                  versionCode 1
                  versionName '1.0'
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file("geomatic-pro-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "geometric-upload"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF


          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="Geomatic Pro"
                  android:icon="@drawable/miladgeo_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          cat > app/src/main/java/com/miladgeo/app/MainActivity.java <<'EOF'
          package com.miladgeo.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.setWebViewClient(new WebViewClient() {

                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              String url) {

                          if (
                              url.startsWith("http://") ||
                              url.startsWith("https://") ||
                              url.startsWith("tg://") ||
                              url.startsWith("mailto:")
                          ) {

                              try {
                                  Intent intent =
                                          new Intent(Intent.ACTION_VIEW);

                                  intent.setData(Uri.parse(url));

                                  startActivity(intent);

                                  return true;

                              } catch (Exception e) {
                                  return false;
                              }
                          }

                          return false;
                      }
                  });

                  webView.loadUrl(
                          "file:///android_asset/index.html"
                  );
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF


      - name: Verify files
        run: |

          echo "Checking source files..."

          test -f index109_multilang.html
          test -f miladgeo-icon.jpg

          echo "Checking Android files..."

          test -f app/src/main/assets/index.html
          test -f app/src/main/res/drawable/miladgeo_icon.jpg
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/miladgeo/app/MainActivity.java
          test -s geomatic-pro-upload.jks

          echo "All files OK."


      - name: Build Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |

          gradle assembleRelease bundleRelease --stacktrace


      - name: Verify APK
        run: |

          test -f app/build/outputs/apk/release/app-release.apk

          ls -lh app/build/outputs/apk/release/app-release.apk


      - name: Verify AAB
        run: |

          test -f app/build/outputs/bundle/release/app-release.aab

          ls -lh app/build/outputs/bundle/release/app-release.aab


      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:
          name: Geomatic-Pro-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7


      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4

        with:
          name: Geomatic-Pro-GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

          cat > app/src/main/java/com/miladgeo/leica02/MainActivity.java <<'EOF_JAVA'
          package com.miladgeo.leica02;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ActivityInfo;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.print.PrintAttributes;
          import android.print.PrintManager;

          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.zip.ZipEntry;
          import java.util.zip.ZipInputStream;

          import org.json.JSONArray;
          import org.xmlpull.v1.XmlPullParser;
          import android.util.Xml;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;
              private static final int SAVE_FILE_REQUEST = 1002;
              private static final int LOCATION_PERMISSION_REQUEST = 1003;
              private byte[] pendingSaveBytes;
              private String pendingGeoOrigin;
              private GeolocationPermissions.Callback pendingGeoCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setGeolocationEnabled(true);

                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              final String origin,
                              final GeolocationPermissions.Callback callback) {
                          if (android.os.Build.VERSION.SDK_INT < 23 ||
                              checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                              checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin;
                              pendingGeoCallback = callback;
                              requestPermissions(
                                  new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION},
                                  LOCATION_PERMISSION_REQUEST);
                          }
                      }

                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          try {
                              Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                              intent.setType("*/*");
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                                  params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public boolean saveFile(final String name, final String mime, final String base64) {
                      try {
                          pendingSaveBytes = Base64.decode(base64, Base64.DEFAULT);
                          runOnUiThread(() -> {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                                  intent.setType(mime == null || mime.isEmpty()
                                      ? "application/octet-stream" : mime);
                                  intent.putExtra(Intent.EXTRA_TITLE,
                                      name == null || name.isEmpty() ? "LEICA02_EXPORT" : name);
                                  startActivityForResult(intent, SAVE_FILE_REQUEST);
                              } catch (Exception e) {
                                  pendingSaveBytes = null;
                              }
                          });
                          return true;
                      } catch (Exception e) {
                          pendingSaveBytes = null;
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void requestLocationPermission() {
                      runOnUiThread(() -> {
                          try {
                              if (android.os.Build.VERSION.SDK_INT < 23 ||
                                  checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                                  checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                                  webView.evaluateJavascript("window.onNativeLocationPermission && window.onNativeLocationPermission(true)", null);
                              } else {
                                  requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, LOCATION_PERMISSION_REQUEST);
                              }
                          } catch (Exception e) {
                              webView.evaluateJavascript("window.onNativeLocationPermission && window.onNativeLocationPermission(false)", null);
                          }
                      });
                  }

                  @JavascriptInterface
                  public boolean isLocationEnabled() {
                      try {
                          LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                          if (lm == null) return false;
                          if (android.os.Build.VERSION.SDK_INT >= 28) return lm.isLocationEnabled();
                          return lm.isProviderEnabled(LocationManager.GPS_PROVIDER) ||
                                 lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER);
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void openLocationSettings() {
                      runOnUiThread(() -> {
                          try {
                              startActivity(new Intent(android.provider.Settings.ACTION_LOCATION_SOURCE_SETTINGS));
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void setLandscape() {
                      runOnUiThread(() -> setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE));
                  }

                  @JavascriptInterface
                  public void setPortrait() {
                      runOnUiThread(() -> setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT));
                  }

                  @JavascriptInterface
                  public void exitLeica() {
                      runOnUiThread(() -> finish());
                  }

                  @JavascriptInterface
                  public void printHtml(final String html) {
                      runOnUiThread(() -> {
                          try {
                              WebView printView = new WebView(MainActivity.this);
                              printView.getSettings().setJavaScriptEnabled(false);
                              printView.loadDataWithBaseURL("file:///android_asset/", html, "text/html", "UTF-8", null);
                              PrintManager printManager = (PrintManager) getSystemService(PRINT_SERVICE);
                              printManager.print(
                                  "Leica 02",
                                  printView.createPrintDocumentAdapter("Leica 02"),
                                  new PrintAttributes.Builder()
                                      .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                                      .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                      .build()
                              );
                          } catch (Exception ignored) {}
                      });
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == LOCATION_PERMISSION_REQUEST) {
                      boolean granted = android.os.Build.VERSION.SDK_INT < 23 ||
                          checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
                          checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;

                      if (pendingGeoCallback != null && pendingGeoOrigin != null) {
                          pendingGeoCallback.invoke(pendingGeoOrigin, granted, false);
                          pendingGeoCallback = null;
                          pendingGeoOrigin = null;
                      }

                      final boolean ok = granted;
                      webView.evaluateJavascript(
                          "window.onNativeLocationPermission && window.onNativeLocationPermission(" + ok + ")",
                          null
                      );
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;

                      if (resultCode == RESULT_OK && data != null) {
                          try {
                              if (data.getData() != null) {
                                  getContentResolver().takePersistableUriPermission(
                                      data.getData(), Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              }
                          } catch (Exception ignored) {}

                          if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          } else if (data.getData() != null) {
                              results = new Uri[]{data.getData()};
                          }
                      }

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                      return;
                  }

                  if (requestCode == SAVE_FILE_REQUEST) {
                      if (resultCode == RESULT_OK && data != null && data.getData() != null && pendingSaveBytes != null) {
                          try (OutputStream out = getContentResolver().openOutputStream(data.getData())) {
                              if (out != null) {
                                  out.write(pendingSaveBytes);
                                  out.flush();
                              }
                          } catch (Exception ignored) {}
                      }
                      pendingSaveBytes = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF_JAVA

      - name: Verify source files and Android package
        run: |
          set -e
          test -s indexleica008.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/res/drawable/leica_ts02_icon.jpg
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/miladgeo/leica02/MainActivity.java
          test -s geomatic-pro-upload.jks
          cmp -s indexleica008.html app/src/main/assets/index.html
          grep -q 'applicationId .com.miladgeo.leica02.' app/build.gradle

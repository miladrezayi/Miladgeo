          grep -q 'saveFile' app/src/main/java/com/miladgeo/leica02/MainActivity.java
          grep -q 'setLandscape' app/src/main/java/com/miladgeo/leica02/MainActivity.java
          grep -q 'setPortrait' app/src/main/java/com/miladgeo/leica02/MainActivity.java

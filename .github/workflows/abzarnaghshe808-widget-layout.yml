          package com.miladgeo.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;

          public class QuickToolsWidgetProvider extends AppWidgetProvider {
              static final String PREFS = "miladgeo_widget_prefs";
              static final String[] TOOL_IDS = {"", "leica5", "measure", "stakeout", "topography", "txt", "excel", "minicad", "coordinates", "units", "calculator", "googleearth", "direction", "flashlight", "compass", "speedometer", "qibla", "level"};
              static final String[] TOOL_LABELS = {"＋ انتخاب ابزار", "🎯 منو ۱ › ۵ شبیه‌ساز لایکا TS02", "📍 منو ۲: برداشت", "📌 منو ۳: پیاده‌سازی", "📐 منو ۴: توپو و ترازیابی", "📄 منو ۵: ورودی تکست / TXT", "📊 منو ۶: ورودی اکسل", "🖥 منو ۹: مینی اتوکد", "↔ منو ۱۱: تبدیل مختصات", "🔁 منو ۱۲: تبدیل واحدها", "🧮 منو ۱۴: ماشین‌حساب", "🌍 منو ۱۷: ترسیم گوگل ارث", "🧭 منو ۱۸: مرکز جهت‌یابی", "🔦 منو ۱۸: چراغ‌قوه", "🧭 منو ۱۸: قطب‌نما", "🏃 منو ۱۸: سرعت‌سنج", "🕋 منو ۱۸: قبله‌نما", "⚖️ منو ۱۸: تراز"};
              static final String[] DEFAULT_TOOLS = {"leica5", "measure", "stakeout", "topography", "", ""};
              static final int SLOT_COUNT = 6;

              static String labelFor(String id) {
                  for (int i = 0; i < TOOL_IDS.length; i++) {
                      if (TOOL_IDS[i].equals(id)) return TOOL_LABELS[i];
                  }
                  return TOOL_LABELS[0];
              }

              static int indexFor(String id) {
                  for (int i = 0; i < TOOL_IDS.length; i++) {
                      if (TOOL_IDS[i].equals(id)) return i;
                  }
                  return 0;
              }

              static String[] readTools(Context context, int widgetId) {
                  SharedPreferences prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  String schemaKey = "tools_schema_" + widgetId;
                  if (prefs.getInt(schemaKey, 0) < 808) {
                      StringBuilder defaults = new StringBuilder();
                      for (int i = 0; i < DEFAULT_TOOLS.length; i++) {
                          if (i > 0) defaults.append(',');
                          defaults.append(DEFAULT_TOOLS[i]);
                      }
                      prefs.edit().putString("tools_" + widgetId, defaults.toString())
                          .putInt(schemaKey, 808).apply();
                      return DEFAULT_TOOLS.clone();
                  }
                  String saved = prefs.getString("tools_" + widgetId, null);
                  if (saved == null) return DEFAULT_TOOLS.clone();
                  String[] values = saved.split(",", -1);
                  String[] result = new String[SLOT_COUNT];
                  for (int i = 0; i < SLOT_COUNT; i++) {
                      result[i] = i < values.length ? values[i] : "";
                  }
                  return result;
              }

              static void updateAllWidgets(Context context) {
                  AppWidgetManager manager = AppWidgetManager.getInstance(context);
                  ComponentName provider = new ComponentName(context, QuickToolsWidgetProvider.class);
                  for (int id : manager.getAppWidgetIds(provider)) updateWidget(context, id);
              }

              static void updateWidget(Context context, int widgetId) {
                  AppWidgetManager manager = AppWidgetManager.getInstance(context);
                  RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_quick_tools);
                  String[] tools = readTools(context, widgetId);

                  Intent configIntent = new Intent(context, QuickToolsWidgetConfigActivity.class);
                  configIntent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                  configIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent configPending = PendingIntent.getActivity(
                      context, widgetId * 20 + 10, configIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  views.setOnClickPendingIntent(R.id.widgetSettings, configPending);

                  for (int i = 0; i < SLOT_COUNT; i++) {
                      int viewId = tileViewId(i);
                      String tool = tools[i] == null ? "" : tools[i];
                      views.setTextViewText(viewId, tool.isEmpty() ? TOOL_LABELS[0] : labelFor(tool));
                      Intent clickIntent;
                      if (tool.isEmpty()) {
                          clickIntent = new Intent(context, QuickToolsWidgetConfigActivity.class);
                          clickIntent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, widgetId);
                          clickIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      } else {
                          clickIntent = new Intent(context, MainActivity.class);
                          clickIntent.putExtra("widget_tool", tool);
                          clickIntent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      }
                      PendingIntent clickPending = PendingIntent.getActivity(
                          context, widgetId * 20 + i, clickIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      views.setOnClickPendingIntent(viewId, clickPending);
                  }
                  manager.updateAppWidget(widgetId, views);
              }

              private static int tileViewId(int slot) {
                  switch (slot) {
                      case 0: return R.id.widgetTile0;
                      case 1: return R.id.widgetTile1;
                      case 2: return R.id.widgetTile2;
                      case 3: return R.id.widgetTile3;
                      case 4: return R.id.widgetTile4;
                      default: return R.id.widgetTile5;
                  }
              }

              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] appWidgetIds) {
                  for (int id : appWidgetIds) updateWidget(context, id);
              }

              @Override
              public void onDeleted(Context context, int[] appWidgetIds) {
                  SharedPreferences.Editor editor = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit();
                  for (int id : appWidgetIds) editor.remove("tools_" + id);
                  editor.apply();
                  super.onDeleted(context, appWidgetIds);
              }
          }

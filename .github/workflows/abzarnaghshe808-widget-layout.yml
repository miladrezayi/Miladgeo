                      + "function openM18(panel){page('menu18');setTimeout(function(){try{var c=document.querySelector('#menu18 [data-m18-open=\"'+panel+'\"]');if(c&&typeof window.m18OpenDirect==='function')window.m18OpenDirect(c);}catch(e){}},100);return true;}"
                      + "var a={"
                      + "'leica5':function(){page('leica');setTimeout(function(){try{var c=document.querySelector('#leica .leica-v36-card');if(c)c.click();}catch(e){}},180);},"
                      + "'measure':function(){page('realMeasure');},"
                      + "'stakeout':function(){if(typeof window.openRealStakeMenu==='function')window.openRealStakeMenu();else page('realStake');},"
                      + "'topography':function(){page('leveling');},"
                      + "'txt':function(){page('points');},"
                      + "'excel':function(){page('excel');},"
                      + "'minicad':function(){page('graphicmap');},"
                      + "'coordinates':function(){page('converter');},"
                      + "'units':function(){page('units');},"
                      + "'calculator':function(){page('menu16');},"
                      + "'googleearth':function(){page('menu17');setTimeout(function(){try{if(typeof window.m17Init==='function')window.m17Init();}catch(e){}},100);},"
                      + "'direction':function(){page('menu18');},"
                      + "'flashlight':function(){openM18('m18PanelFlash');},"
                      + "'compass':function(){openM18('m18PanelCompass');},"
                      + "'speedometer':function(){openM18('m18PanelSpeed');},"
                      + "'qibla':function(){openM18('m18PanelQibla');},"
                      + "'level':function(){openM18('m18PanelLevel');}};"
                      + "if(a[k]){a[k]();}"
                      + "}catch(e){console.error('widget shortcut',e);}})();";
                  webView.evaluateJavascript(js, null);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  pendingWidgetTool = intent.getStringExtra("widget_tool");
                  if (pendingWidgetTool != null && webView != null) {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              private void launchCameraForWebView() {'''
              if method_marker not in java:
                  raise SystemExit('Could not find camera method insertion point in MainActivity.java')
              java = java.replace(method_marker, helper, 1)
              java_path.write_text(java, encoding='utf-8')
          PY_WIDGET_PATCH



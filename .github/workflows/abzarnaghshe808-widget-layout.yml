                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return openExternalIfNeeded(request == null || request.getUrl() == null ? null : request.getUrl().toString());
                      }
                  });'''
              replacement = '''            @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return openExternalIfNeeded(request == null || request.getUrl() == null ? null : request.getUrl().toString());
                      }
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          if (pendingWidgetTool != null && !pendingWidgetTool.isEmpty()) {
                              view.postDelayed(() -> handlePendingWidgetTool(), 900);
                          }
                      }
                  });'''
              if marker not in java:
                  raise SystemExit('Could not find WebViewClient insertion point in MainActivity.java')
              java = java.replace(marker, replacement, 1)
              method_marker = '    private void launchCameraForWebView() {'
              helper = r'''    private void handlePendingWidgetTool() {
                  final String tool = pendingWidgetTool;
                  if (tool == null || tool.isEmpty() || webView == null) return;
                  pendingWidgetTool = null;
                  String js = "(function(){try{var k=" + JSONObject.quote(tool) + ";"

          package com.miladgeo.app;

          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Spinner;
          import android.widget.TextView;

          public class QuickToolsWidgetConfigActivity extends Activity {
              private int appWidgetId = AppWidgetManager.INVALID_APPWIDGET_ID;
              private final Spinner[] selectors = new Spinner[QuickToolsWidgetProvider.SLOT_COUNT];

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setResult(RESULT_CANCELED);
                  appWidgetId = getIntent().getIntExtra(
                      AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
                  if (appWidgetId == AppWidgetManager.INVALID_APPWIDGET_ID) {
                      finish();
                      return;
                  }

                  ScrollView scroll = new ScrollView(this);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(18), dp(18), dp(18));
                  root.setBackgroundColor(Color.rgb(247, 250, 247));

                  TextView title = new TextView(this);
                  title.setText("تنظیم ویجت جعبه‌ابزار نقشه‌بردار");
                  title.setTextSize(20);
                  title.setTextColor(Color.rgb(35, 105, 62));
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(0, dp(6), 0, dp(12));
                  root.addView(title, new LinearLayout.LayoutParams(-1, -2));

                  TextView hint = new TextView(this);
                  hint.setText("برای هر یک از ۶ خانه، ابزار دلخواه را انتخاب کن. چهار خانهٔ اول به‌صورت پیش‌فرض روی شبیه‌ساز لایکا، برداشت، پیاده‌سازی و توپو/ترازیابی تنظیم شده‌اند. از فهرست می‌توانی هر خانه را به ابزار دلخواه تغییر بدهی.");
                  hint.setTextSize(14);
                  hint.setTextColor(Color.DKGRAY);
                  hint.setPadding(0, 0, 0, dp(14));
                  root.addView(hint, new LinearLayout.LayoutParams(-1, -2));

                  String[] saved = QuickToolsWidgetProvider.readTools(this, appWidgetId);
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(
                      this, android.R.layout.simple_spinner_item, QuickToolsWidgetProvider.TOOL_LABELS);
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);

                  for (int i = 0; i < selectors.length; i++) {
                      TextView label = new TextView(this);
                      label.setText("خانه " + (i + 1));
                      label.setTextSize(15);
                      label.setTextColor(Color.rgb(45, 70, 50));
                      label.setPadding(0, dp(5), 0, dp(4));
                      root.addView(label, new LinearLayout.LayoutParams(-1, -2));

                      Spinner spinner = new Spinner(this);
                      spinner.setAdapter(adapter);
                      spinner.setSelection(QuickToolsWidgetProvider.indexFor(saved[i]));
                      selectors[i] = spinner;
                      root.addView(spinner, new LinearLayout.LayoutParams(-1, dp(48)));
                  }

                  Button save = new Button(this);
                  save.setText("ذخیره و ساخت ویجت");
                  LinearLayout.LayoutParams saveParams = new LinearLayout.LayoutParams(-1, -2);
                  saveParams.topMargin = dp(18);
                  root.addView(save, saveParams);
                  save.setOnClickListener(v -> saveConfiguration());

                  scroll.addView(root);
                  setContentView(scroll);
              }

              private void saveConfiguration() {
                  StringBuilder selected = new StringBuilder();
                  for (int i = 0; i < selectors.length; i++) {
                      int position = selectors[i].getSelectedItemPosition();
                      String id = QuickToolsWidgetProvider.TOOL_IDS[position];
                      if (i > 0) selected.append(',');
                      selected.append(id);
                  }
                  SharedPreferences prefs = getSharedPreferences(
                      QuickToolsWidgetProvider.PREFS, MODE_PRIVATE);
                  prefs.edit().putString("tools_" + appWidgetId, selected.toString())
                      .putInt("tools_schema_" + appWidgetId, 808).apply();

                  QuickToolsWidgetProvider.updateWidget(this, appWidgetId);
                  Intent result = new Intent();
                  result.putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId);
                  setResult(RESULT_OK, result);
                  finish();
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }

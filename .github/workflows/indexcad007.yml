name: Build Mini AutoCAD Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'indexcad007.html'
      - 'icon.png'
      - '.github/workflows/indexcad007.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android WebView project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/miniautocad/app app/src/main/assets app/src/main/res/drawable
          cp indexcad007.html app/src/main/assets/index.html
          if [ -f icon.png ]; then cp icon.png app/src/main/res/drawable/app_icon.png; fi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MiniAutoCAD"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.miniautocad.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.miniautocad.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 7
                  versionName '1.0.7'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <application android:theme="@android:style/Theme.Material.NoActionBar" android:label="Mini AutoCAD" android:icon="@drawable/miniautocad_icon" android:usesCleartextTraffic="true" android:allowBackup="true">
              <activity android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden" android:screenOrientation="unspecified" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/miniautocad/app/MainActivity.java <<'EOF'
          package com.miniautocad.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.*;
          import android.view.*;
          import android.widget.*;
          import android.app.DownloadManager;
          import android.os.Environment;
          import java.io.*;
          import java.net.URLDecoder;

          public class MainActivity extends Activity {
            WebView web;
            ValueCallback<Uri[]> fileCallback;
            static final int PICK_FILE = 71;
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(0xff111111);
              getWindow().setNavigationBarColor(0xff111111);
              web = new WebView(this);
              web.setBackgroundColor(0xff111111);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true); s.setAllowContentAccess(true);
              s.setSupportZoom(false); s.setBuiltInZoomControls(false);
              web.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams params) {
                  if(fileCallback!=null) fileCallback.onReceiveValue(null);
                  fileCallback=cb;
                  Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("*/*");
                  i.putExtra(Intent.EXTRA_MIME_TYPES,new String[]{"application/dxf","text/plain","text/csv","application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-excel"});
                  startActivityForResult(i,PICK_FILE); return true;
                }
              });
              web.setDownloadListener((url, ua, disposition, mime, size) -> {
                try {
                  String name = URLUtil.guessFileName(url, disposition, mime);
                  DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                  req.setTitle(name); req.setDescription("Mini AutoCAD export");
                  req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                  req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                  if(mime!=null) req.setMimeType(mime);
                  ((DownloadManager)getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                  Toast.makeText(this,"Saving to Downloads",Toast.LENGTH_SHORT).show();
                } catch(Exception e) { Toast.makeText(this,"Export failed: "+e.getMessage(),Toast.LENGTH_LONG).show(); }
              });
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
            }
            @Override protected void onActivityResult(int requestCode,int resultCode,Intent data) {
              super.onActivityResult(requestCode,resultCode,data);
              if(requestCode==PICK_FILE && fileCallback!=null) {
                Uri[] result=null;
                if(resultCode==RESULT_OK && data!=null && data.getData()!=null) result=new Uri[]{data.getData()};
                fileCallback.onReceiveValue(result); fileCallback=null;
              }
            }
            @Override public void onBackPressed() {
              if(web!=null && web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF
          cat > app/src/main/res/drawable/app_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#071522" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#00D95A" android:pathData="M0,0h8v108h-8z"/>
            <path android:fillColor="#F21D2F" android:pathData="M100,0h8v108h-8z"/>
            <path android:fillColor="#F3222B" android:pathData="M20,82L48,22L61,22L90,82L74,82L54,39L36,82z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M17,91h74v4h-74z"/>
          </vector>
          EOF
          # If a PNG icon is present, use it as the launcher drawable instead of the simple fallback vector.
          if [ -f icon.png ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            cp icon.png app/src/main/res/drawable-nodpi/miniautocad_icon.png
            sed -i 's/android:label="Mini AutoCAD"/android:label="Mini AutoCAD"/' app/src/main/AndroidManifest.xml
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-AutoCAD-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

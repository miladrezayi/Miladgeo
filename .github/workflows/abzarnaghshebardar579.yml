          cat > app/src/main/java/com/miladgeo/app/PdfReaderActivity.java <<'EOF_PDF_JAVA'
          package com.miladgeo.app;

          import android.app.Activity;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.pdf.PdfRenderer;
          import android.os.Bundle;
          import android.os.ParcelFileDescriptor;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import java.io.File;

          public class PdfReaderActivity extends Activity {
              private PdfRenderer renderer;
              private ParcelFileDescriptor descriptor;
              private ImageView image;
              private TextView pageInfo;
              private int pageIndex = 0;
              private String pdfName = "MiladGeo.pdf";

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  pdfName = getIntent().getStringExtra("pdf_name");
                  if (pdfName == null || pdfName.isEmpty()) pdfName = "MiladGeo.pdf";
                  setTitle(pdfName);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.WHITE);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(10, 8, 10, 8);

                  Button prev = new Button(this); prev.setText("صفحه قبل");
                  Button next = new Button(this); next.setText("صفحه بعد");
                  pageInfo = new TextView(this);
                  pageInfo.setGravity(Gravity.CENTER);
                  pageInfo.setTextSize(15);
                  LinearLayout.LayoutParams infoLp = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f);
                  bar.addView(prev, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  bar.addView(pageInfo, infoLp);
                  bar.addView(next, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  root.addView(bar);

                  image = new ImageView(this);
                  image.setBackgroundColor(Color.WHITE);
                  image.setAdjustViewBounds(true);
                  image.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  root.addView(image, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  setContentView(root);

                  prev.setOnClickListener(v -> showPage(pageIndex - 1));
                  next.setOnClickListener(v -> showPage(pageIndex + 1));

                  try {
                      String path = getIntent().getStringExtra("pdf_path");
                      if (path == null) throw new Exception("missing pdf");
                      File file = new File(path);
                      descriptor = ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY);
                      renderer = new PdfRenderer(descriptor);
                      showPage(0);
                  } catch (Exception e) {
                      pageInfo.setText("خطا در باز کردن PDF");
                      prev.setEnabled(false); next.setEnabled(false);
                  }
              }

              private void showPage(int index) {
                  if (renderer == null || index < 0 || index >= renderer.getPageCount()) return;
                  try {
                      PdfRenderer.Page page = renderer.openPage(index);
                      int w = Math.max(1, page.getWidth() * 2);
                      int h = Math.max(1, page.getHeight() * 2);
                      Bitmap bitmap = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      bitmap.eraseColor(Color.WHITE);
                      page.render(bitmap, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY);
                      page.close();
                      image.setImageBitmap(bitmap);
                      pageIndex = index;
                      pageInfo.setText("" + (index + 1) + " / " + renderer.getPageCount());
                  } catch (Exception e) {
                      pageInfo.setText("خطا در نمایش صفحه");
                  }
              }

              @Override protected void onDestroy() {
                  try { if (renderer != null) renderer.close(); } catch (Exception ignored) {}
                  try { if (descriptor != null) descriptor.close(); } catch (Exception ignored) {}
                  super.onDestroy();
              }
          }
          EOF_PDF_JAVA


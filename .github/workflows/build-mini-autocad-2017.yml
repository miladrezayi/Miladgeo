name: Build Mini AutoCAD 2017 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Indexcad20-22-android-io-fix.html'
      - 'mini-autocad-2017.jpg'
      - '.github/workflows/build-mini-autocad-2017.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Mini AutoCAD source files
        run: |
          test -s Indexcad20-22-android-io-fix.html
          test -s mini-autocad-2017.jpg
          file mini-autocad-2017.jpg

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create Mini AutoCAD 2017 Android project
        run: |
          mkdir -p app/src/main/java/com/miladgeo/miniautocad2017
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable-nodpi
          cp Indexcad20-22-android-io-fix.html app/src/main/assets/index.html
          cp mini-autocad-2017.jpg app/src/main/res/drawable-nodpi/mini_autocad_icon.jpg

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiniAutoCAD2017"
          include(":app")
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > gradle.properties <<'GRADLE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.miladgeo.miniautocad2017'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.miladgeo.miniautocad2017'
                  minSdk 23
                  targetSdk 28
                  versionCode 2017
                  versionName '2017.0'
              }
              buildTypes {
                  debug {
                      applicationIdSuffix '.debug'
                  }
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Mini AutoCAD 2017"
                  android:icon="@drawable/mini_autocad_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/com/miladgeo/miniautocad2017/MainActivity.java <<'JAVA'
          package com.miladgeo.miniautocad2017;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.URLUtil;
          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;
          import java.net.URLDecoder;
          import android.util.Base64;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private ValueCallback<String> pendingDownloadName;
              private byte[] pendingDownloadBytes;
              private String pendingMime = "application/octet-stream";
              private static final int FILE_CHOOSER_REQUEST = 1101;
              private static final int SAVE_FILE_REQUEST = 1102;

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view,
                              ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          try {
                              Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              intent.setType("*/*");
                              intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                                  params.getMode() == FileChooserParams.MODE_OPEN_MULTIPLE);
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.setDownloadListener(new DownloadListener() {
                      @Override public void onDownloadStart(String url, String userAgent,
                              String contentDisposition, String mimeType, long contentLength) {
                          try {
                              if (url != null && url.startsWith("data:")) {
                                  int comma = url.indexOf(',');
                                  if (comma < 0) return;
                                  String meta = url.substring(0, comma);
                                  String payload = url.substring(comma + 1);
                                  pendingMime = meta.contains(":") ? meta.substring(5).split(";")[0] : "application/octet-stream";
                                  pendingDownloadBytes = meta.contains(";base64")
                                      ? Base64.decode(payload, Base64.DEFAULT)
                                      : URLDecoder.decode(payload, "UTF-8").getBytes("UTF-8");
                                  String name = URLUtil.guessFileName(url, contentDisposition, pendingMime);
                                  if (name == null || name.trim().isEmpty() || name.equals("downloadfile")) name = "MiniAutoCAD-export.bin";
                                  Intent save = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                                  save.addCategory(Intent.CATEGORY_OPENABLE);
                                  save.setType(pendingMime);
                                  save.putExtra(Intent.EXTRA_TITLE, name);
                                  startActivityForResult(save, SAVE_FILE_REQUEST);
                              } else if (url != null && (url.startsWith("https://") || url.startsWith("http://"))) {
                                  Intent open = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  startActivity(open);
                              }
                          } catch (Exception ignored) { }
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST) {
                      if (filePathCallback != null) {
                          Uri[] result = null;
                          if (resultCode == RESULT_OK && data != null) {
                              if (data.getClipData() != null) {
                                  int count = data.getClipData().getItemCount();
                                  result = new Uri[count];
                                  for (int i = 0; i < count; i++) result[i] = data.getClipData().getItemAt(i).getUri();
                              } else if (data.getData() != null) result = new Uri[]{data.getData()};
                          }
                          filePathCallback.onReceiveValue(result);
                          filePathCallback = null;
                      }
                  } else if (requestCode == SAVE_FILE_REQUEST && resultCode == RESULT_OK && data != null && data.getData() != null && pendingDownloadBytes != null) {
                      try (OutputStream out = getContentResolver().openOutputStream(data.getData())) {
                          if (out != null) out.write(pendingDownloadBytes);
                      } catch (Exception ignored) { }
                      pendingDownloadBytes = null;
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA

      - name: Verify generated Android project
        run: |
          test -s app/src/main/assets/index.html
          test -s app/src/main/res/drawable-nodpi/mini_autocad_icon.jpg
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/miladgeo/miniautocad2017/MainActivity.java

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Mini AutoCAD 2017 APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-AutoCAD-2017-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

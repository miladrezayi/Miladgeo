name: Build جهانگرد هوشمند Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '003jahangard55.html'
      - 'Jahangard.png'
      - '.github/workflows/003jahangard55.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate app files
        run: |
          set -euo pipefail
          test -s 003jahangard55.html
          test -s Jahangard.png
          file Jahangard.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Create Android project
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/miladgeo/jahangard
          mkdir -p app/src/main/assets app/src/main/res/values app/src/main/res/drawable-nodpi
          cp 003jahangard55.html app/src/main/assets/index.html
          cp Jahangard.png app/src/main/res/drawable-nodpi/jahangard_icon.png
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Jahangard'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.miladgeo.jahangard'
              compileSdk 35
              signingConfigs {
                  release {
                      storeFile rootProject.file("geomatic-pro-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "geometric-upload"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              defaultConfig {
                  applicationId 'com.miladgeo.jahangard'
                  minSdk 23
                  targetSdk 35
                  versionCode 55
                  versionName '55.0'
              }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">جهانگرد هوشمند</string>
          </resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/jahangard_icon"
                  android:roundIcon="@drawable/jahangard_icon"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/miladgeo/jahangard/MainActivity.java <<'EOF'
          package com.miladgeo.jahangard;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.JavascriptInterface;
          import android.speech.tts.TextToSpeech;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private GeolocationPermissions.Callback geoCallback;
              private String geoOrigin;
              private static final int GEO_PERMISSION_REQUEST = 7401;
              private TextToSpeech tts;
              private boolean ttsReady = false;

              private final class AndroidTTSBridge {
                  @JavascriptInterface public void speak(String text, String language) {
                      runOnUiThread(() -> {
                          if (tts == null || !ttsReady || text == null || text.trim().isEmpty()) return;
                          Locale locale = Locale.forLanguageTag(language == null ? "en-US" : language);
                          int result = tts.setLanguage(locale);
                          if (result == TextToSpeech.LANG_MISSING_DATA || result == TextToSpeech.LANG_NOT_SUPPORTED) {
                              tts.setLanguage(Locale.US);
                          }
                          if (Build.VERSION.SDK_INT >= 21) tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "milad-" + System.currentTimeMillis());
                          else tts.speak(text, TextToSpeech.QUEUE_FLUSH, null);
                      });
                  }
              }

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  tts = new TextToSpeech(this, status -> { ttsReady = status == TextToSpeech.SUCCESS; });
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setBlockNetworkImage(false);
                  settings.setLoadsImagesAutomatically(true);
                  webView.addJavascriptInterface(new AndroidTTSBridge(), "MiladAndroidTTS");
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(false);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED && checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                              geoOrigin = origin;
                              geoCallback = callback;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, GEO_PERMISSION_REQUEST);
                          } else {
                              callback.invoke(origin, true, false);
                          }
                      }
                  });
                  if (savedInstanceState != null) webView.restoreState(savedInstanceState);
                  else webView.loadUrl("file:///android_asset/index.html");
              }

              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == GEO_PERMISSION_REQUEST && geoCallback != null) {
                      boolean granted = false;
                      for (int result : grantResults) if (result == PackageManager.PERMISSION_GRANTED) granted = true;
                      geoCallback.invoke(geoOrigin, granted, false);
                      geoCallback = null;
                      geoOrigin = null;
                  }
              }

              @Override protected void onDestroy() {
                  if (tts != null) { tts.stop(); tts.shutdown(); tts = null; }
                  if (webView != null) { webView.removeJavascriptInterface("MiladAndroidTTS"); webView.destroy(); webView = null; }
                  super.onDestroy();
              }

              @Override protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (webView != null) webView.saveState(outState);
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then echo "KEYSTORE_BASE64 secret is missing"; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > geomatic-pro-upload.jks
          test -s geomatic-pro-upload.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_PASSWORD:-}"
          test -n "${KEY_PASSWORD:-}"
          gradle clean assembleRelease --stacktrace --no-daemon

      - name: Verify release APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jahangard55-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

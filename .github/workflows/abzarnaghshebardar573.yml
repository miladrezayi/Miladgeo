name: Build جعبه‌ابزار نقشه‌بردار V573 مستقل

on:
  workflow_dispatch:
  push:
    paths:
      - 'index573.html'
      - 'abzarnaghshebardar573.jpg'
      - '.github/workflows/abzarnaghshebardar573.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > geomatic-pro-upload.jks
          test -s geomatic-pro-upload.jks

      - name: Create Android project from proven MiladGeo Android recipe
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          mkdir -p app/src/main/java/com/miladgeo/abzarnaghshebardar573
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/drawable

          cp index573.html app/src/main/assets/index.html

          cp abzarnaghshebardar573.jpg app/src/main/res/drawable/abzarnaghshebardar573.jpg
          test -s app/src/main/res/drawable/abzarnaghshebardar573.jpg

          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/miladrezayi/Miladgeo/main/.github/workflows/build-apk380.yml \
            -o /tmp/build-apk380.yml

          test -s /tmp/build-apk380.yml

          python3 - <<'PYX'
          from pathlib import Path
          import re

          s = Path('/tmp/build-apk380.yml').read_text()

          m = re.search(
              r"cat > app/src/main/java/com/miladgeo/app/MainActivity.java <<'EOF_JAVA'\n(.*?)\nEOF_JAVA",
              s,
              re.S
          )

          if not m:
              raise SystemExit(
                  'MainActivity recipe not found in proven Android build recipe'
              )

          java = m.group(1).replace(
              'package com.miladgeo.app;',
              'package com.miladgeo.abzarnaghshebardar573;'
          )

          Path(
              'app/src/main/java/com/miladgeo/abzarnaghshebardar573/MainActivity.java'
          ).write_text(java + '\n')
          PYX

          cat > settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AbzarNaghshebardarV573"
          include(":app")
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE

          cat > gradle.properties <<'GRADLE'
          android.suppressUnsupportedCompileSdk=36
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.miladgeo.abzarnaghshebardar573'
              compileSdk 36

              defaultConfig {
                  applicationId 'com.miladgeo.abzarnaghshebardar573'
                  minSdk 23
                  targetSdk 36
                  versionCode 573
                  versionName '573.0'
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file("geomatic-pro-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "geometric-upload"
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="جعبه‌ابزار نقشه‌بردار"
                  android:icon="@drawable/abzarnaghshebardar573"
                  android:roundIcon="@drawable/abzarnaghshebardar573"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF_MANIFEST

      - name: Verify generated project
        run: |
          set -e

          test -s index573.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/miladgeo/abzarnaghshebardar573/MainActivity.java
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/abzarnaghshebardar573.jpg
          test -s geomatic-pro-upload.jks

          cmp -s index573.html app/src/main/assets/index.html

          grep -q 'class MainActivity' \
            app/src/main/java/com/miladgeo/abzarnaghshebardar573/MainActivity.java

          grep -q 'compileSdk 36' app/build.gradle
          grep -q 'targetSdk 36' app/build.gradle
          grep -q 'versionCode 573' app/build.gradle

      - name: Build Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          gradle assembleRelease bundleRelease --stacktrace

      - name: Verify APK and AAB
        run: |
          set -e

          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab

          ls -lh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AbzarNaghshebardar-V573-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: AbzarNaghshebardar-V573-GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

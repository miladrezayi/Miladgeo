name: Build MiladGeo V429 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index429.html'
      - '.github/workflows/build-apk429.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > geomatic-pro-upload.jks
          test -s geomatic-pro-upload.jks
      - name: Create Android project from V380 build recipe
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p app/src/main/java/com/miladgeo/app app/src/main/assets app/src/main/res/drawable
          cp index429.html app/src/main/assets/index.html
          curl -L --fail https://raw.githubusercontent.com/miladrezayi/Miladgeo/main/miladgeo-icon.jpg -o app/src/main/res/drawable/miladgeo_icon.jpg
          test -s app/src/main/res/drawable/miladgeo_icon.jpg
          curl -L --fail https://raw.githubusercontent.com/miladrezayi/Miladgeo/main/.github/workflows/build-apk380.yml -o /tmp/build-apk380.yml
          python3 - <<'PYX'
          from pathlib import Path
          import re
          s=Path('/tmp/build-apk380.yml').read_text()
          m=re.search(r"cat > app/src/main/java/com/miladgeo/app/MainActivity\.java <<'EOF_JAVA'\n(.*?)\n          EOF_JAVA",s,re.S)
          if not m: raise SystemExit('MainActivity recipe not found')
          Path('app/src/main/java/com/miladgeo/app/MainActivity.java').write_text(m.group(1)+'\n')
          PYX
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MiladGeoV429"
          include(":app")
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          GRADLE
          cat > gradle.properties <<'GRADLE'
          android.suppressUnsupportedCompileSdk=36
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android { namespace 'com.miladgeo.app'; compileSdk 36
            defaultConfig { applicationId 'com.miladgeo.app'; minSdk 23; targetSdk 36; versionCode 129; versionName '129.0' }
            signingConfigs { release { storeFile rootProject.file("geomatic-pro-upload.jks"); storePassword System.getenv("KEYSTORE_PASSWORD"); keyAlias "geometric-upload"; keyPassword System.getenv("KEY_PASSWORD") } }
            buildTypes { release { minifyEnabled false; shrinkResources false; signingConfig signingConfigs.release } }
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <application android:allowBackup="true" android:label="MiladGeo" android:icon="@drawable/miladgeo_icon" android:roundIcon="@drawable/miladgeo_icon" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST
      - name: Verify generated project
        run: |
          set -e
          test -s index429.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/java/com/miladgeo/app/MainActivity.java
          test -s app/src/main/res/drawable/miladgeo_icon.jpg
          test -s geomatic-pro-upload.jks
          cmp -s index429.html app/src/main/assets/index.html
      - name: Build Release APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Verify APK and AAB
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiladGeo-V429-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: MiladGeo-V429-GooglePlay-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

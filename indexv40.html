/* V37 MODE GATE: landscape-first Leica experience with portrait fallback */
body.mode-gate{overflow:hidden}
.mode-gate-screen{position:fixed;inset:0;z-index:100000;background:linear-gradient(145deg,#172019,#0a0d0b);display:flex;align-items:center;justify-content:center;padding:20px;color:#eef5ee;text-align:center;font-family:Arial,Helvetica,sans-serif}

/* V39 LANDSCAPE FINAL: LCD LEFT / F1-F4 BELOW LCD / CONTROL CONSOLE RIGHT */
@media (orientation: landscape){
  html,body{width:100%;height:100%;min-height:0;overflow:hidden;}
  body{padding:0;display:block;}
  body.leica-landscape .device{
    /* V36-36: fit the Leica into its parent iframe/card, not the phone viewport.
       This is intentionally limited to LANDSCAPE. Portrait rules remain untouched. */
    width:100%;max-width:100%;height:calc(100% - 64px);min-height:0;
    margin:32px auto;box-sizing:border-box;border:0;border-radius:0;padding:5px 8px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  body.leica-landscape .header{height:24px;flex:0 0 24px;font-size:16px;}
  body.leica-landscape .panel{
    display:grid!important;
    grid-template-columns:minmax(0,1fr) minmax(300px,350px);
    grid-template-rows:minmax(0,1fr) auto auto;
    column-gap:10px;row-gap:5px;align-items:stretch;
    flex:1 1 auto;min-height:0;
  }
  body.leica-landscape .lcd-frame{
    grid-column:1;grid-row:1;width:100%!important;height:100%;
    min-width:0;min-height:0;padding:5px;border-width:4px;
  }
  body.leica-landscape .lcd{height:100%!important;min-height:0;padding:7px;}
  body.leica-landscape .screen{min-height:0;}
  body.leica-landscape .screen-body{overflow:auto;}

  /* F1-F4 directly under LCD */
  body.leica-landscape .softkeys{
    grid-column:1;grid-row:2;
    width:100%;height:39px;align-self:stretch;
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:5px;margin:0!important;padding:0!important;
  }
  body.leica-landscape .softkey-wrap{gap:1px;min-width:0;}
  body.leica-landscape .softkeys button{height:31px;border-radius:7px;font-size:11px;}
  body.leica-landscape .softkey-caption{font-size:6px;min-height:7px;}

  /* PWR / MODE / EXIT directly below F1-F4 */
  body.leica-landscape .main-menu-bar{
    grid-column:1;grid-row:3;
    width:100%;max-width:none;height:27px;margin:0!important;
    padding:2px 6px;font-size:8px;
  }
  body.leica-landscape .main-menu-bar>span:first-child{font-size:8px;}
  body.leica-landscape .main-menu-actions button{height:20px;min-width:35px;font-size:7px;padding:1px 5px;}

  /* Right-side console: short keypad, nav directly underneath */
  body.leica-landscape .lower-console{
    grid-column:2;grid-row:1 / span 3;
    width:100%;max-width:none;height:100%;margin:0!important;
    display:flex;flex-direction:column;gap:6px;align-self:stretch;
  }
  body.leica-landscape .lower-console .keypad{
    width:100%!important;height:190px!important;min-height:190px;
    margin:0!important;padding:5px;gap:4px;
    flex:0 0 190px;
  }
  body.leica-landscape .lower-console .num{font-size:15px;}
  body.leica-landscape .lower-console .num small{font-size:5px;}

  /* Four-way exactly below keypad, with side buttons around it */
  body.leica-landscape .lower-console .right{
    width:100%;height:122px;min-height:122px;
    display:grid;grid-template-columns:minmax(0,1fr) 108px minmax(0,1fr);
    grid-template-rows:1fr 1fr;column-gap:5px;row-gap:4px;
    align-items:center;
  }
  body.leica-landscape .lower-console .nav-wrap{
    grid-column:2;grid-row:1 / span 2;
    width:108px;height:122px;margin:0!important;
    display:flex;align-items:center;justify-content:center;
  }
  body.leica-landscape .lower-console .nav{width:108px;height:112px;}
  body.leica-landscape .lower-console .nav button{font-size:20px;}
  body.leica-landscape .lower-console .nav .up{top:-5px!important;}
  body.leica-landscape .lower-console .nav .down{bottom:-4px!important;}
  body.leica-landscape .lower-console .nav .nleft{left:-3px!important;font-size:23px!important;}
  body.leica-landscape .lower-console .nav .nright{right:-3px!important;font-size:23px!important;}
  body.leica-landscape .lower-console .nav .ok{width:50px;height:50px;font-size:12px;}

  body.leica-landscape .lower-console .side-controls{
    display:contents;
    margin:0!important;
  }
  body.leica-landscape .lower-console .side-controls button{
    height:46px;width:100%;min-width:0;font-size:8px;padding:0 2px;
    border-radius:7px;
  }
  /* left of nav: MEAS / ESC */
  body.leica-landscape .lower-console .side-controls button:nth-child(1){grid-column:1;grid-row:1;}
  body.leica-landscape .lower-console .side-controls button:nth-child(4){grid-column:1;grid-row:2;}
  /* right of nav: MENU / INTER */
  body.leica-landscape .lower-console .side-controls button:nth-child(2){grid-column:3;grid-row:1;}
  body.leica-landscape .lower-console .side-controls button:nth-child(3){grid-column:3;grid-row:2;}

  body.leica-landscape .status,body.leica-landscape .brandline{display:none;}
}

(function(){
  const gate=document.getElementById('modeGate');
  const enterLandscape=document.getElementById('enterLandscape');
  const enterPortrait=document.getElementById('enterPortrait');
  let gateOpen=true;
  function hideGate(mode){
    gateOpen=false;
    document.body.classList.remove('mode-gate','leica-landscape','leica-portrait');
    document.body.classList.add(mode==='landscape'?'leica-landscape':'leica-portrait');
    if(gate) gate.style.display='none';
  }
  async function lockOrientation(mode){
    try{
      if(window.AndroidBridge){
        if(mode==='landscape'&&AndroidBridge.setLandscape) AndroidBridge.setLandscape();
        if(mode==='portrait'&&AndroidBridge.setPortrait) AndroidBridge.setPortrait();
      }
    }catch(e){}
    try{
      if(document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen();
    }catch(e){}
    try{
      if(screen.orientation && screen.orientation.lock) await screen.orientation.lock(mode==='landscape'?'landscape-primary':'portrait-primary');
    }catch(e){
      try{if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock(mode);}catch(e2){}
    }
  }
  async function requestLandscape(){await lockOrientation('landscape');hideGate('landscape');}
  enterLandscape.onclick=requestLandscape;
  enterPortrait.onclick=async function(){await lockOrientation('portrait');hideGate('portrait')};
  // V41: entry is always prepared as the horizontal Leica screen.
  lockOrientation('landscape');
})();
(function(){
  function syncOrientationClass(){
    if(document.body.classList.contains('mode-gate')) return;
    const landscape=window.matchMedia&&window.matchMedia('(orientation: landscape)').matches;
    document.body.classList.toggle('leica-landscape',!!landscape);
    document.body.classList.toggle('leica-portrait',!landscape);
  }
  window.addEventListener('orientationchange',()=>setTimeout(syncOrientationClass,120));
  window.addEventListener('resize',()=>setTimeout(syncOrientationClass,80));
})();

function downloadBlob(name,blob){
  showDownloadToast(`شروع دانلود فایل «${name}»`);
  if(typeof status!=='undefined'&&status)status.textContent=`DOWNLOAD STARTED · ${name}`;
  const nativeSave=()=>{
    try{
      if(window.AndroidBridge&&typeof AndroidBridge.saveFile==='function'){
        const reader=new FileReader();
        reader.onload=()=>{
          try{
            const dataUrl=String(reader.result||'');
            const comma=dataUrl.indexOf(',');
            const base64=comma>=0?dataUrl.slice(comma+1):dataUrl;
            const ok=AndroidBridge.saveFile(name,blob.type||'application/octet-stream',base64);
            if(ok!==false)return;
          }catch(e){}
          browserSave();
        };
        reader.onerror=()=>browserSave();
        reader.readAsDataURL(blob);
        return true;
      }
    }catch(e){}
    return false;
  };
  const browserSave=()=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);
    requestAnimationFrame(()=>a.click());
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},2500);
  };
  if(!nativeSave())browserSave();
}

function gsiBuildLinework(parsed){

    if(!currentCode)currentCode=code;
    current.push(p);
  }
  flush();

    if(valid.length>=2){seq++;lines.push({id:`J${String(seq).padStart(3,'0')}`,code:'JOIN',method:'JOIN POINTS',points:valid.map(id=>byId.get(id.toUpperCase()).id),count:valid.length});}
  }
  return lines;
}

function parseDxfText(txt){

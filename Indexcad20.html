<!doctype html>
<html lang="fa" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiladGeo AutoCAD Simulator V15 + V18</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#ddd;font-family:Arial,sans-serif}
#app{height:100%;display:grid;grid-template-rows:94px 1fr 46px}
#topbar{height:94px;background:#202020;border-bottom:1px solid #3a3a3a;display:block;padding:0;overflow:hidden;white-space:nowrap}
button{background:#2b2b2b;color:#ddd;border:1px solid #4a4a4a;border-radius:4px;padding:7px 10px;min-height:34px;font-size:13px}
button:hover{background:#3a3a3a}
button.active{background:#075985;border-color:#0ea5e9}
button:disabled{opacity:.42}
.tabbar{height:34px;display:flex;align-items:stretch;gap:2px;background:#191919;border-bottom:1px solid #3a3a3a;padding:0 4px;overflow-x:auto;overflow-y:hidden}
.tab{border:0;border-radius:0;background:transparent;min-height:30px;height:34px;padding:4px 12px;font-size:12px;font-weight:bold}
.tab.active{background:#2b2b2b;border-bottom:2px solid #0ea5e9;color:#fff}
.toolRibbon{height:60px;display:flex;align-items:stretch;overflow-x:auto;overflow-y:hidden;padding:3px 5px;gap:6px}
.toolGroup{display:flex;align-items:stretch;gap:3px;flex:0 0 auto}
.hiddenPanel{display:none!important}
.ioCards{display:flex;align-items:stretch;gap:6px;flex:0 0 auto}.ioCard{display:flex;align-items:stretch;gap:3px;padding:3px 4px;background:#1b1b1b;border:1px solid #454545;border-radius:5px;box-shadow:inset 0 0 0 1px #111}.ioTitle{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:bold;color:#aaa;padding:0 2px;min-width:18px}.ioCard .cadTool{min-width:58px}.ioCard.importCard{border-color:#24536a}.ioCard.exportCard{border-color:#4f4a28}
.cadTool{min-width:52px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 5px;border:1px solid transparent;background:#272727;border-radius:3px}
.cadTool:hover{background:#383838;border-color:#555}
.cadTool.active{background:#075985;border-color:#0ea5e9}
.toolIcon{font-size:23px;line-height:25px;font-family:Arial,sans-serif}
.cadTool small{font-size:9px;font-weight:bold}
#viewport{position:relative;min-height:0;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#coords{position:absolute;right:10px;top:8px;background:rgba(0,0,0,.72);border:1px solid #333;padding:6px 9px;font:13px monospace;pointer-events:none;z-index:4}
#ucs{position:absolute;left:12px;bottom:12px;width:70px;height:70px;pointer-events:none;z-index:3}
#ucs:before{content:"";position:absolute;left:34px;bottom:12px;width:2px;height:45px;background:#d33}
#ucs:after{content:"";position:absolute;left:34px;bottom:12px;width:45px;height:2px;background:#3ad}
#ux,#uy{position:absolute;font:bold 12px monospace}
#ux{left:60px;bottom:10px;color:#4dd}
#uy{left:27px;bottom:55px;color:#f66}
#commandbar{background:#181818;border-top:1px solid #3a3a3a;display:grid;grid-template-columns:1fr auto;align-items:center;padding:4px 7px;gap:6px;z-index:5}
#commandInput{width:100%;height:36px;background:#050505;color:#fff;border:1px solid #555;border-radius:4px;padding:0 10px;font:14px monospace;outline:none}
#status{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.statusBtn{font:11px monospace;padding:5px 7px;min-height:28px}
#log{position:absolute;left:8px;bottom:8px;max-width:75%;font:12px monospace;color:#aaa;pointer-events:none;z-index:4}
@media(max-width:650px){
 #app{grid-template-rows:94px 1fr 82px}
 #topbar{height:94px}
 .tab{padding:4px 10px;font-size:11px}
 .toolRibbon{gap:4px;padding:3px 4px}
 .cadTool{min-width:48px}
 .ioCards{gap:4px}.ioCard{gap:2px}.ioCard .cadTool{min-width:50px}
 #commandbar{grid-template-columns:1fr;grid-template-rows:36px 34px}
 #status{justify-content:center}
}

#polarGuide{position:absolute;pointer-events:none;z-index:3;display:none;color:#00e5ff;font:11px monospace;background:rgba(0,0,0,.55);padding:2px 4px;border:1px solid #005a6b;border-radius:2px}
.layerCtl{display:flex;align-items:center;gap:4px;height:54px;padding:4px 5px;background:#242424;border:1px solid #444;border-radius:4px;flex:0 0 auto}.layerCtl label{font:10px monospace;color:#aaa}.layerCtl select{height:30px;background:#080808;color:#fff;border:1px solid #555;border-radius:3px;max-width:110px}.layerCtl button{min-height:28px;padding:4px 7px;font-size:10px}
#dynamicInput{position:absolute;min-width:150px;background:rgba(10,10,10,.88);border:1px solid #00aaff;border-radius:3px;padding:5px 8px;color:#fff;font:12px monospace;pointer-events:none;z-index:6;display:none;white-space:nowrap}
.legendHint{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.78);border:1px solid #444;padding:7px 9px;font:12px Arial;color:#ddd;display:none;z-index:5;pointer-events:none}.textEditor{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:#202020;border:1px solid #555;border-radius:8px;padding:14px;min-width:min(92vw,360px);box-shadow:0 12px 40px rgba(0,0,0,.55);display:none}.textEditor h3{margin:0 0 10px;font-size:15px}.textEditor textarea{width:100%;min-height:80px;resize:vertical;background:#080808;color:#fff;border:1px solid #555;border-radius:5px;padding:8px;font-size:16px}.textEditor .field{display:flex;gap:8px;align-items:center;margin-top:8px}.textEditor .field label{font-size:12px;color:#bbb;min-width:48px}.textEditor input[type=number]{width:90px;background:#080808;color:#fff;border:1px solid #555;border-radius:5px;padding:7px}.textEditor input[type=color]{width:52px;height:34px;background:#080808;border:1px solid #555;border-radius:5px;padding:2px}.textEditor .hint{font-size:11px;color:#999;margin-top:7px}.textEditor .row{display:flex;gap:7px;margin-top:9px}.textEditor button{flex:1}

#bottomToolbox{position:absolute;right:10px;bottom:10px;z-index:12;display:flex;flex-direction:column;gap:4px;padding:5px;background:rgba(25,25,25,.94);border:1px solid #555;border-radius:6px;box-shadow:0 5px 18px rgba(0,0,0,.5);width:62px;}
#ioQuickToolbox{position:fixed;left:10px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:1000;display:flex;flex-direction:column;gap:4px;padding:5px;background:rgba(25,25,25,.94);border:1px solid #555;border-radius:6px;box-shadow:0 5px 18px rgba(0,0,0,.5);width:58px;}
#ioQuickToolbox button{width:46px;height:48px;min-height:48px;padding:2px;display:flex;align-items:center;justify-content:center;background:#292929;color:#ddd;border:1px solid #484848;border-radius:4px;font-size:28px;line-height:1;}
#ioQuickToolbox button:hover{background:#383838;border-color:#666}
#ioQuickToolbox .modeExitBtn{width:44px;height:42px;min-height:42px;padding:2px 3px;font-size:18px;font-weight:900;line-height:1;flex-direction:column;gap:1px;}
#ioQuickToolbox .modeExitBtn small{font-size:8px;font-weight:900;line-height:9px;}
#ioQuickToolbox .modeExitBtn.modeBtn{background:#075985;border-color:#0ea5e9;}
#ioQuickToolbox .modeExitBtn.exitBtn{background:#3a2525;border-color:#8b4b4b;}
#ioQuickToolbox button.ioQuickActive{background:#075985;border-color:#0ea5e9}
.ioCard.ioQuickFocus{box-shadow:0 0 0 2px #0ea5e9,inset 0 0 0 1px #111;}
@media(max-width:650px){#ioQuickToolbox{left:7px;bottom:calc(82px + env(safe-area-inset-bottom));width:54px;padding:4px;gap:3px}#ioQuickToolbox button{width:44px;height:45px;min-height:45px}}
#bottomToolbox button{width:50px;height:48px;min-height:48px;padding:2px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#292929;color:#ddd;border:1px solid #484848;border-radius:4px;}
#bottomToolbox button:hover{background:#383838;border-color:#666}
#bottomToolbox .toolIcon{font-size:20px;line-height:21px}
#bottomToolbox small{font-size:8px;font-weight:bold;line-height:10px}
@media(max-width:650px){#bottomToolbox{right:7px;bottom:7px;width:58px;padding:4px;gap:3px}#bottomToolbox button{width:48px;height:45px;min-height:45px}}

/* Mini AutoCAD mode / exit controls */
.modeExitStack{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;align-self:center;justify-content:center;margin:2px 0 0;}
.toolGroup[data-panel="insert"]{flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;}
.toolGroup[data-panel="insert"] .ioCards{flex:0 0 54px;}
#toolRibbon:has(.toolGroup[data-panel="insert"]:not(.hiddenPanel)){height:112px;}
.modeExitBtn{width:72px;height:25px;min-height:25px;padding:2px 5px;font-size:10px;font-weight:900;background:#292929;color:#eee;border:1px solid #555;border-radius:4px;cursor:pointer;}
.modeExitBtn:hover{background:#3a3a3a;border-color:#777;}
.modeExitBtn.modeBtn{border-color:#2877a0;color:#d9f2ff;}
.modeExitBtn.exitBtn{border-color:#8a554f;color:#ffe2dd;}

/* Landscape: let the complete Mini AutoCAD page scroll instead of clipping tools. */
html.mini-landscape, body.mini-landscape{height:auto;min-height:100%;overflow-y:auto;overflow-x:hidden;}
body.mini-landscape #app{height:auto;min-height:100vh;grid-template-rows:auto minmax(360px,1fr) auto;}
body.mini-landscape #topbar{height:auto;min-height:94px;overflow:visible;}
body.mini-landscape #toolRibbon{overflow-x:auto;overflow-y:visible;}
body.mini-landscape #viewport{min-height:calc(100vh - 140px);height:calc(100vh - 140px);}
body.mini-landscape #commandbar{position:sticky;bottom:0;}

/* Portrait: keep the compact fixed CAD layout. */
body.mini-portrait #viewport{min-height:0;}

/* Mini AutoCAD orientation chooser — Android safe-area/dynamic viewport */
#orientationChooser{position:fixed;inset:0;z-index:99999;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));background:#07140d;color:#eef7ee;font-family:Arial,sans-serif;direction:rtl;overflow:auto;-webkit-overflow-scrolling:touch;}
#orientationChooser .ocCard{box-sizing:border-box;width:min(94vw,760px);height:auto;min-height:0;max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 20px);overflow-y:auto;overflow-x:hidden;border:3px solid #4d9a55;border-radius:30px;background:linear-gradient(145deg,#173d21,#1f542a 52%,#163b20);box-shadow:0 18px 55px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 24px;}
#orientationChooser .ocBrand{font-size:52px;font-weight:900;letter-spacing:2px;direction:ltr;margin-bottom:4px;}
#orientationChooser .ocVersion{font-size:21px;color:#a8c6ad;direction:ltr;margin-bottom:20px;letter-spacing:1px;}
#orientationChooser .ocIcon{width:100px;height:100px;flex:0 0 auto;border-radius:16px;background:linear-gradient(145deg,#8fa29a,#44584d);display:flex;align-items:center;justify-content:center;font-size:54px;color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 7px 15px rgba(0,0,0,.28);margin-bottom:18px;}
#orientationChooser .ocTitle{font-size:28px;font-weight:900;margin-bottom:10px;}
#orientationChooser .ocText{font-size:17px;color:#d2e2d5;margin-bottom:20px;line-height:1.65;}
#orientationChooser .ocActions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;direction:rtl;width:100%;}
#orientationChooser .ocBtn{min-width:220px;min-height:68px;border-radius:18px;border:2px solid #79bb7e;background:linear-gradient(180deg,#edf5e9,#bdd9bc);color:#17301a;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 7px 16px rgba(0,0,0,.25);padding:9px 16px;flex:0 1 auto;}
#orientationChooser .ocBtn:active{transform:translateY(1px);}
#orientationChooser .ocBtn.primary{background:linear-gradient(180deg,#cfeac9,#91cb8c);}
#orientationChooser .ocNote{margin-top:14px;color:#9fbaa4;font-size:13px;}
@media(max-width:560px){#orientationChooser .ocCard{width:100%;border-radius:22px;padding:18px 12px}.ocBrand{font-size:38px!important}.ocVersion{font-size:15px!important;margin-bottom:12px!important}.ocIcon{width:78px!important;height:78px!important;font-size:40px!important;margin-bottom:12px!important}.ocTitle{font-size:22px!important}.ocText{font-size:15px!important;margin-bottom:16px!important}.ocBtn{min-width:200px;min-height:60px;font-size:16px!important}}
@media(orientation:landscape){#orientationChooser{align-items:flex-start;padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom));}#orientationChooser .ocCard{width:min(96vw,900px);max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 12px);justify-content:flex-start;padding:10px 16px;border-radius:18px;}#orientationChooser .ocBrand{font-size:28px;margin-bottom:0}.ocVersion{font-size:12px!important;margin-bottom:5px!important}.ocIcon{width:48px!important;height:48px!important;font-size:27px!important;margin-bottom:5px!important;border-radius:10px}.ocTitle{font-size:18px!important;margin-bottom:4px!important}.ocText{font-size:12px!important;line-height:1.35!important;margin-bottom:7px!important}.ocActions{gap:8px!important}.ocBtn{min-width:180px!important;min-height:46px!important;font-size:14px!important;padding:5px 10px!important}.ocNote{font-size:11px!important;margin-top:5px!important}}
</style>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="tabbar">
      <button class="tab active" data-tab="home">HOME</button>
      <button class="tab" data-tab="insert">INSERT</button>
      <button class="tab" data-tab="annotate">ANNOTATE</button>
      <button class="tab" data-tab="view">VIEW</button>
      <button class="tab" data-tab="manage">MANAGE</button>
    </div>
    <div id="toolRibbon" class="toolRibbon">
      <div class="toolGroup" data-panel="home">
        <button class="cadTool" data-cmd="LINE"><span class="toolIcon">╱</span><small>LINE</small></button>
        <button class="cadTool" data-cmd="PLINE"><span class="toolIcon">╱┐</span><small>PLINE</small></button>
        <button class="cadTool" data-cmd="CIRCLE"><span class="toolIcon">○</span><small>CIRCLE</small></button>
        <button class="cadTool" data-cmd="RECTANGLE"><span class="toolIcon">□</span><small>RECT</small></button>
        <button class="cadTool" data-cmd="POINT"><span class="toolIcon">•</span><small>POINT</small></button>
        <button class="cadTool" data-cmd="MOVE"><span class="toolIcon">✥</span><small>MOVE</small></button>
        <button class="cadTool" data-cmd="COPY"><span class="toolIcon">⧉</span><small>COPY</small></button>
        <button class="cadTool" data-cmd="ROTATE"><span class="toolIcon">↻</span><small>ROTATE</small></button>
        <button class="cadTool" data-cmd="OFFSET"><span class="toolIcon">∥</span><small>OFFSET</small></button>
        <button class="cadTool" data-cmd="TRIM"><span class="toolIcon">✂</span><small>TRIM</small></button>
        <button class="cadTool" data-cmd="PAN"><span class="toolIcon">✋</span><small>PAN</small></button>
        <button class="cadTool" data-cmd="ZOOM"><span class="toolIcon">⌕</span><small>ZOOM</small></button>
        <button class="cadTool" id="fitBtn"><span class="toolIcon">⛶</span><small>FIT</small></button>
        <button class="cadTool" id="undoBtn"><span class="toolIcon">↶</span><small>UNDO</small></button><button class="cadTool" id="homeClearBtn"><span class="toolIcon">⌫</span><small>ERASE ALL</small></button>
      </div>
      <div class="toolGroup hiddenPanel" data-panel="insert">
        <div class="ioCards">
          <div class="ioCard importCard"><div class="ioTitle">IMPORT</div>
            <button class="cadTool" id="importDxfBtn"><span class="toolIcon">⇩</span><small>IMPORT DXF</small></button>
            <button class="cadTool" id="importExcelBtn"><span class="toolIcon">▤</span><small>IMPORT EXCEL</small></button>
            <button class="cadTool" id="importTxtBtn"><span class="toolIcon">TXT</span><small>IMPORT TXT</small></button>
          </div>
          <div class="ioCard exportCard"><div class="ioTitle">EXPORT</div>
            <button class="cadTool" id="exportDxfBtn"><span class="toolIcon">⇧</span><small>EXPORT DXF</small></button>
            <button class="cadTool" id="exportExcelBtn"><span class="toolIcon">▤</span><small>EXPORT EXCEL</small></button>
            <button class="cadTool" id="exportTxtBtn"><span class="toolIcon">TXT</span><small>EXPORT TXT</small></button>
            <button class="cadTool" id="exportPdfBtn"><span class="toolIcon">PDF</span><small>EXPORT PDF</small></button>
            <button class="cadTool" id="exportKmlBtn"><span class="toolIcon">⌖</span><small>EXPORT KML</small></button>
          </div>
        </div>
      </div>
      <div class="toolGroup hiddenPanel" data-panel="annotate">
        <button class="cadTool" data-cmd="TEXT"><span class="toolIcon">T</span><small>TEXT</small></button>
        <button class="cadTool" id="dimensionBtn"><span class="toolIcon">↔</span><small>DIMENSION</small></button>
      </div>
      <div class="toolGroup hiddenPanel" data-panel="view">
        <button class="cadTool" id="gridBtn"><span class="toolIcon">▦</span><small>GRID</small></button>
        <button class="cadTool" data-cmd="ZOOM"><span class="toolIcon">⌕</span><small>ZOOM</small></button>
        <button class="cadTool" data-cmd="PAN"><span class="toolIcon">✋</span><small>PAN</small></button>
        <button class="cadTool" id="viewFitBtn"><span class="toolIcon">⛶</span><small>FIT</small></button>
      </div>
      <div class="toolGroup hiddenPanel" data-panel="manage">
        <button class="cadTool" id="orthoBtn"><span class="toolIcon">∟</span><small>ORTHO</small></button>
        <button class="cadTool" id="osnapBtn"><span class="toolIcon">⊙</span><small>OSNAP</small></button>
        <button class="cadTool" id="snapBtn"><span class="toolIcon">#</span><small>SNAP</small></button><button class="cadTool" id="polarBtn"><span class="toolIcon">∠</span><small>POLAR</small></button>
        <button class="cadTool" id="clearBtn"><span class="toolIcon">⌫</span><small>CLEAR</small></button><div class="layerCtl"><label>LAYER</label><select id="layerSelect"></select><button id="newLayerBtn">+ LAYER</button><input id="layerColor" type="color" value="#e5e5e5" title="Layer Color"><button id="layerVisBtn">ON/OFF</button></div>
      </div>
    </div>
    <input id="dxfFile" type="file" accept=".dxf,text/plain" hidden>
    <input id="excelFile" type="file" accept=".xlsx,.xls,.csv" hidden>
    <input id="txtFile" type="file" accept=".txt,.csv,text/plain" hidden>
  </div>
  <main id="viewport">
    <canvas id="cad"></canvas>
    <div id="coords">X 0.00 &nbsp; Y 0.00</div>
    <div id="polarGuide"></div><div id="dynamicInput" aria-live="polite"></div>
    <div id="ucs"><span id="ux">X</span><span id="uy">Y</span></div>
    <div id="log"></div>
    <div id="ioQuickToolbox" aria-label="Import Export, mode and exit quick tools">
      <button id="quickImport" title="IMPORT">⇩</button>
      <button id="quickExport" title="EXPORT">⇧</button>
      <button class="modeExitBtn modeBtn" id="miniModeBtn" title="MODE" type="button">↔<small>MODE</small></button>
      <button class="modeExitBtn exitBtn" id="miniExitBtn" title="EXIT" type="button">✕<small>EXIT</small></button>
    </div>
    <div id="bottomToolbox" aria-label="Quick tools">
      <button id="quickPan"><span class="toolIcon">✋</span><small>PAN</small></button>
      <button id="quickUndo"><span class="toolIcon">↶</span><small>UNDO</small></button>
      <button id="quickFit"><span class="toolIcon">⛶</span><small>FIT</small></button>
      <button id="quickMove"><span class="toolIcon">✥</span><small>MOVE</small></button>
      <button id="quickCopy"><span class="toolIcon">⧉</span><small>COPY</small></button>
      <button id="quickErase"><span class="toolIcon">⌫</span><small>ERASE</small></button>
      <button id="quickEraseAll"><span class="toolIcon">✕</span><small>E ALL</small></button>
    </div>
    <div id="legendHint" class="legendHint">Select LEGEND 1–4, then draw your map inside the MAP AREA. Use LEGEND + / − to resize.</div>
    <div id="textEditor" class="textEditor"><h3 id="textEditorTitle">TEXT — فارسی / English</h3><textarea id="textValue" dir="auto" placeholder="Type Persian or English text..."></textarea><div class="field"><label>SIZE</label><input id="textSize" type="number" min="0.5" step="0.5" value="4"></div><div class="field"><label>COLOR</label><input id="textColor" type="color" value="#ffffff"></div><div class="hint">موقع ایجاد یا انتخاب متن، اندازه و رنگ را تغییر بده.</div><div class="row"><button id="textOk">PLACE TEXT</button><button id="textCancel">CANCEL</button></div></div>
  </main>
  <div id="commandbar">
    <input id="commandInput" autocomplete="off" spellcheck="false" placeholder="Command: LINE, PLINE, CIRCLE, RECTANGLE, POINT, ZOOM, PAN  |  PL=PLINE">
    <div id="status">
      <button class="statusBtn" id="orthoStatus">ORTHO</button>
      <button class="statusBtn active" id="gridStatus">GRID</button>
      <button class="statusBtn active" id="osnapStatus">OSNAP</button>
      <button class="statusBtn" id="snapStatus">SNAP</button><button class="statusBtn" id="polarStatus">POLAR</button>
    </div>
  </div>
</div>
<script>
(() => {
const canvas=document.getElementById('cad'), ctx=canvas.getContext('2d');
const viewport=document.getElementById('viewport'), coords=document.getElementById('coords');
const input=document.getElementById('commandInput'), log=document.getElementById('log');
let dpr=1,w=0,h=0;
let view={cx:0,cy:0,scale:45};
let objects=[];
let command=null, points=[], mouse={x:0,y:0};
let modify=null;
let selectedObject=null;
let selectedObjects=[];
let editingText=null;
let layers={0:{name:"0",color:"#e5e5e5",on:true}};
let currentLayer="0";
let measureStart=null;
let lastLineEnd=null;
let lineStart=null;

// ---------- DXF / CAD helpers ----------
function dxfNum(v){
  const n=parseFloat(String(v).trim().replace(',','.'));
  return Number.isFinite(n)?n:0;
}
function readDXFPairs(text){
  const lines=String(text).replace(/\uFEFF/g,'').replace(/\r/g,'').split('\n');
  const pairs=[];
  for(let i=0;i+1<lines.length;){
    const code=lines[i].trim();
    const value=lines[i+1].trim();
    if(/^-?\d+$/.test(code)){
      pairs.push([code,value]); i+=2;
    }else{
      i++;
    }
  }
  return pairs;
}
function arcToLines(cx,cy,r,startDeg,endDeg){
  let s=startDeg,e=endDeg; while(e<=s)e+=360;
  const n=Math.max(8,Math.min(180,Math.ceil((e-s)/5)));
  const out=[]; let prev={x:cx+r*Math.cos(s*Math.PI/180),y:cy+r*Math.sin(s*Math.PI/180)};
  for(let i=1;i<=n;i++){
    const a=s+(e-s)*i/n, q={x:cx+r*Math.cos(a*Math.PI/180),y:cy+r*Math.sin(a*Math.PI/180)};
    out.push({type:'LINE',a:prev,b:q}); prev=q;
  }
  return out;
}
function parseDXF(text){
  const pairs=readDXFPairs(text), out=[];
  let inEntities=false;
  for(let i=0;i<pairs.length;i++){
    const [code,value]=pairs[i];
    if(code==='0' && value==='SECTION'){
      if(pairs[i+1]?.[0]==='2' && pairs[i+1]?.[1]==='ENTITIES') inEntities=true;
      continue;
    }
    if(code==='0' && value==='ENDSEC'){inEntities=false;continue}
    if(!inEntities || code!=='0')continue;

    const type=value.toUpperCase();
    let j=i+1, d=[];
    while(j<pairs.length && pairs[j][0]!=='0'){d.push(pairs[j]);j++;}
    const val=(c)=>d.find(x=>x[0]===c)?.[1];
    if(type==='LINE'){
      const a={x:dxfNum(val('10')),y:dxfNum(val('20'))};
      const b={x:dxfNum(val('11')),y:dxfNum(val('21'))};
      out.push({type:'LINE',a,b});
    }else if(type==='POINT'){
      out.push({type:'POINT',p:{x:dxfNum(val('10')),y:dxfNum(val('20'))}});
    }else if(type==='CIRCLE'){
      const r=dxfNum(val('40')); if(r>0)out.push({type:'CIRCLE',c:{x:dxfNum(val('10')),y:dxfNum(val('20'))},r});
    }else if(type==='ARC'){
      const r=dxfNum(val('40'));
      if(r>0)out.push(...arcToLines(dxfNum(val('10')),dxfNum(val('20')),r,dxfNum(val('50')),dxfNum(val('51'))));
    }else if(type==='LWPOLYLINE'){
      const pts=[]; let x=null;
      for(const [c,v] of d){
        if(c==='10')x=dxfNum(v);
        else if(c==='20' && x!==null){pts.push({x,y:dxfNum(v)});x=null;}
      }
      for(let k=1;k<pts.length;k++)out.push({type:'LINE',a:pts[k-1],b:pts[k]});
      const flags=parseInt(val('70')||'0',10);
      if((flags&1) && pts.length>2)out.push({type:'LINE',a:pts.at(-1),b:pts[0]});
    }
    i=j-1;
  }

  // Old-style POLYLINE / VERTEX / SEQEND
  for(let i=0;i<pairs.length;i++){
    if(pairs[i][0]==='0' && pairs[i][1]==='POLYLINE'){
      const pts=[]; let closed=false, j=i+1;
      while(j<pairs.length){
        if(pairs[j][0]==='0' && pairs[j][1]==='SEQEND')break;
        if(pairs[j][0]==='0' && pairs[j][1]==='VERTEX'){
          let k=j+1,x=null,y=null;
          while(k<pairs.length && pairs[k][0]!=='0'){
            if(pairs[k][0]==='10')x=dxfNum(pairs[k][1]);
            if(pairs[k][0]==='20')y=dxfNum(pairs[k][1]);
            k++;
          }
          if(x!==null&&y!==null)pts.push({x,y});
          j=k; continue;
        }
        if(pairs[j][0]==='70')closed=(parseInt(pairs[j][1],10)&1)!==0;
        j++;
      }
      for(let k=1;k<pts.length;k++)out.push({type:'LINE',a:pts[k-1],b:pts[k]});
      if(closed&&pts.length>2)out.push({type:'LINE',a:pts.at(-1),b:pts[0]});
      i=j;
    }
  }
  return out;
}
function exportDXF(){
  const lines=['0','SECTION','2','ENTITIES'];
  for(const o of objects){
    if(o.type==='LINE') lines.push('0','LINE','8',layerOf(o),'10',o.a.x,'20',o.a.y,'11',o.b.x,'21',o.b.y);
    else if(o.type==='POINT') lines.push('0','POINT','8',layerOf(o),'10',o.p.x,'20',o.p.y);
    else if(o.type==='CIRCLE') lines.push('0','CIRCLE','8',layerOf(o),'10',o.c.x,'20',o.c.y,'40',o.r);
    else if(o.type==='POLYLINE'){
      const pts=o.pts||[]; if(pts.length>=2){
        lines.push('0','LWPOLYLINE','8','0','90',pts.length,'70',o.closed?1:0);
        for(const pt of pts) lines.push('10',pt.x,'20',pt.y);
      }
    }
    else if(o.type==='RECTANGLE'){
      const a=o.a,b=o.b;
      [[a,{x:b.x,y:a.y}],[{x:b.x,y:a.y},b],[b,{x:a.x,y:b.y}],[{x:a.x,y:b.y},a]].forEach(([p,q])=>{
        lines.push('0','LINE','8',layerOf(o),'10',p.x,'20',p.y,'11',q.x,'21',q.y);
      });
    }
  }
  lines.push('0','ENDSEC','0','EOF');
  const blob=new Blob([lines.join('\n')+'\n'],{type:'application/dxf'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='MiladGeo_CAD.dxf';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// Survey point export helpers — PENZD = Point, Easting, Northing, Elevation, Description.
function getPENZDPoints(){
  let n=1;
  return objects.filter(o=>o.type==='POINT').map(o=>({
    P:o.number ?? o.pointNumber ?? n++,
    E:Number(o.p?.x ?? 0),
    N:Number(o.p?.y ?? 0),
    Z:Number(o.z ?? o.elevation ?? 0),
    D:String(o.description ?? o.desc ?? layerOf(o) ?? '')
  }));
}
function downloadBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function escXml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}
function exportTXT_PENZD(){
  const pts=getPENZDPoints();
  const lines=pts.map(p=>[p.P,p.E,p.N,p.Z,p.D].join(','));
  const txt=(lines.length?'': '')+lines.join('\r\n')+(lines.length?'\r\n':'');
  downloadBlob(new Blob(['\ufeff',txt],{type:'text/plain;charset=utf-8'}),'MiladGeo_PENZD.txt');
  log.textContent=`EXPORT TXT exported — ${pts.length} point(s)`;
}
function exportExcel_PENZD(){
  const pts=getPENZDPoints();
  // Excel 2003 XML Spreadsheet format; opens directly in Excel and preserves PENZD columns.
  const rows=[['P','E','N','Z','D'],...pts.map(p=>[p.P,p.E,p.N,p.Z,p.D])];
  const xml=`<?xml version="1.0" encoding="UTF-8"?>\n`+
    `<?mso-application progid="Excel.Sheet"?>\n`+
    `<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">`+
    `<Worksheet ss:Name="PENZD"><Table>`+
    rows.map((r,ri)=>`<Row>${r.map((v,ci)=>{const type=ri===0||ci===4?'String':'Number';return `<Cell><Data ss:Type="${type}">${escXml(v)}</Data></Cell>`;}).join('')}</Row>`).join('')+
    `</Table></Worksheet></Workbook>`;
  downloadBlob(new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'}),'MiladGeo_PENZD.xls');
  log.textContent=`Excel PENZD exported — ${pts.length} point(s)`;
}
function exportKML(){
  const pts=getPENZDPoints();

  const kml=`<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>MiladGeo Points</name>${placemarks}</Document></kml>`;
  downloadBlob(new Blob([kml],{type:'application/vnd.google-earth.kml+xml;charset=utf-8'}),'MiladGeo_Points.kml');
  log.textContent=`KML exported — ${pts.length} point(s)`;

function exportPDF(){
  if(!objects.length){log.textContent='PDF export — drawing is empty';return;}
  const pts=getPENZDPoints();
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const add=(x,y)=>{minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)};
  for(const o of objects){
    if(o.type==='POINT')add(o.p.x,o.p.y);
    else if(o.type==='LINE'||o.type==='DIMENSION'){add(o.a.x,o.a.y);add(o.b.x,o.b.y)}
    else if(o.type==='CIRCLE'){add(o.c.x-o.r,o.c.y-o.r);add(o.c.x+o.r,o.c.y+o.r)}
    else if(o.type==='RECTANGLE'){add(o.a.x,o.a.y);add(o.b.x,o.b.y)}
    else if(o.type==='POLYLINE'){for(const q of o.pts||[])add(q.x,q.y)}
    else if(o.type==='TEXT'){add(o.p.x,o.p.y);add(o.p.x+String(o.text||'').length*(o.size||4),o.p.y+(o.size||4))}
  }
  if(!Number.isFinite(minX)){log.textContent='PDF export failed';return;}
  const W=1000,H=620,pad=55,spanX=Math.max(1e-9,maxX-minX),spanY=Math.max(1e-9,maxY-minY),sc=Math.min((W-2*pad)/spanX,(H-2*pad)/spanY);
  const sx=x=>pad+(x-minX)*sc, sy=y=>H-(pad+(y-minY)*sc);
  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><g fill="none" stroke="#111" stroke-width="1.6">`;
  for(const o of objects){
    if(o.type==='LINE')svg+=`<line x1="${sx(o.a.x)}" y1="${sy(o.a.y)}" x2="${sx(o.b.x)}" y2="${sy(o.b.y)}"/>`;
    else if(o.type==='POLYLINE'){const ps=(o.pts||[]).map(q=>`${sx(q.x)},${sy(q.y)}`).join(' ');svg+=`<polyline points="${ps}"${o.closed?' fill="none"':''}/>`;if(o.closed&&o.pts?.length>2)svg+=`<line x1="${sx(o.pts.at(-1).x)}" y1="${sy(o.pts.at(-1).y)}" x2="${sx(o.pts[0].x)}" y2="${sy(o.pts[0].y)}"/>`;}
    else if(o.type==='RECTANGLE'){const x0=Math.min(o.a.x,o.b.x),x1=Math.max(o.a.x,o.b.x),y0=Math.min(o.a.y,o.b.y),y1=Math.max(o.a.y,o.b.y);svg+=`<rect x="${sx(x0)}" y="${sy(y1)}" width="${(x1-x0)*sc}" height="${(y1-y0)*sc}"/>`;}
    else if(o.type==='CIRCLE')svg+=`<circle cx="${sx(o.c.x)}" cy="${sy(o.c.y)}" r="${Math.abs(o.r*sc)}"/>`;
    else if(o.type==='POINT')svg+=`<path d="M ${sx(o.p.x)-5} ${sy(o.p.y)} L ${sx(o.p.x)+5} ${sy(o.p.y)} M ${sx(o.p.x)} ${sy(o.p.y)-5} L ${sx(o.p.x)} ${sy(o.p.y)+5}"/>`;
    else if(o.type==='DIMENSION'){const dx=o.b.x-o.a.x,dy=o.b.y-o.a.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len,off=Math.max(spanX,spanY)*.025,ax=o.a.x+nx*off,ay=o.a.y+ny*off,bx=o.b.x+nx*off,by=o.b.y+ny*off;svg+=`<line x1="${sx(o.a.x)}" y1="${sy(o.a.y)}" x2="${sx(ax)}" y2="${sy(ay)}"/><line x1="${sx(o.b.x)}" y1="${sy(o.b.y)}" x2="${sx(bx)}" y2="${sy(by)}"/><line x1="${sx(ax)}" y1="${sy(ay)}" x2="${sx(bx)}" y2="${sy(by)}" stroke="#cc8800"/>`;}
  }
  svg+='</g><g fill="#111" font-family="Arial, sans-serif">';
  for(const o of objects){if(o.type==='TEXT')svg+=`<text x="${sx(o.p.x)}" y="${sy(o.p.y)}" font-size="${Math.max(9,(o.size||4)*sc)}">${esc(o.text)}</text>`;if(o.type==='DIMENSION'){const mx=(sx(o.a.x)+sx(o.b.x))/2,my=(sy(o.a.y)+sy(o.b.y))/2;svg+=`<text x="${mx}" y="${my-7}" text-anchor="middle" font-size="12" font-weight="bold" fill="#a66a00">${Number(o.distance||Math.hypot(o.b.x-o.a.x,o.b.y-o.a.y)).toFixed(3)}</text>`;}}
  svg+=`</g><text x="${W/2}" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">MiladGeo CAD — Drawing Export</text></svg>`;
  const rows=pts.map(p=>`<tr><td>${esc(p.P)}</td><td>${esc(p.E)}</td><td>${esc(p.N)}</td><td>${esc(p.Z)}</td><td>${esc(p.D)}</td></tr>`).join('');
  const w=window.open('', '_blank');if(!w){log.textContent='PDF export blocked — allow pop-ups';return;}
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>MiladGeo CAD PDF</title><style>body{font-family:Arial,sans-serif;margin:12mm;color:#111}h2{text-align:center;margin:0 0 8px}svg{width:100%;height:auto;border:1px solid #777;display:block}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #777;padding:5px;text-align:center;font-size:11px}th{background:#eee}@media print{body{margin:8mm}svg{page-break-inside:avoid}table{page-break-inside:avoid}}</style></head><body><h2>MiladGeo — CAD Drawing</h2>${svg}${pts.length?`<table><thead><tr><th>P</th><th>E</th><th>N</th><th>Z</th><th>D</th></tr></thead><tbody>${rows}</tbody></table>`:''}<script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`);w.document.close();log.textContent=`PDF print ready — ${objects.length} drawing object(s)${pts.length?` + ${pts.length} PENZD point(s)`:''}`;
}

function fitDrawing(){
  if(!objects.length){view.cx=0;view.cy=0;view.scale=1;draw();return}
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  const add=(x,y)=>{minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)};
  for(const o of objects){
    if(o.type==='POINT')add(o.p.x,o.p.y);
    else if(o.type==='LINE'){add(o.a.x,o.a.y);add(o.b.x,o.b.y)}
    else if(o.type==='CIRCLE'){add(o.c.x-o.r,o.c.y-o.r);add(o.c.x+o.r,o.c.y+o.r)}
    else if(o.type==='RECTANGLE'){add(o.a.x,o.a.y);add(o.b.x,o.b.y)}
    else if(o.type==='POLYLINE'){for(const pt of o.pts||[])add(pt.x,pt.y)}
    else if(o.type==='TEXT'){add(o.p.x,o.p.y);add(o.p.x+String(o.text||'').length*(o.size||4),o.p.y+(o.size||4))}
    else if(o.type==='DIMENSION'){add(o.a.x,o.a.y);add(o.b.x,o.b.y)}
    else if(o.type==='LEGEND'){add(o.x,o.y);add(o.x+(o.w||36)*(o.scale||1),o.y+(o.h||24)*(o.scale||1))}
  }
  if(!Number.isFinite(minX)){view.cx=0;view.cy=0;view.scale=1;draw();return}
  view.cx=(minX+maxX)/2;view.cy=(minY+maxY)/2;
  const spanX=Math.max(1e-12,maxX-minX),spanY=Math.max(1e-12,maxY-minY);
  const margin=.82;
  view.scale=Math.max(0.000001,Math.min(100000000,Math.min(w*margin/spanX,h*margin/spanY)));
  draw();
}

function resize(){
 dpr=Math.max(1,devicePixelRatio||1); const r=viewport.getBoundingClientRect();
 w=r.width;h=r.height;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
 ctx.setTransform(dpr,0,0,dpr,0,0); draw();
}
function worldToScreen(p){return{x:w/2+(p.x-view.cx)*view.scale,y:h/2-(p.y-view.cy)*view.scale}}
function screenToWorld(x,y){return{x:view.cx+(x-w/2)/view.scale,y:view.cy-(y-h/2)/view.scale}}
function niceGridStep(){
 const target=70/view.scale, pow=Math.pow(10,Math.floor(Math.log10(target)));
 for(const n of [1,2,5,10]) if(n*pow>=target)return n*pow; return 10*pow;
}
function drawGrid(){
 if(!settings.grid)return;
 const step=niceGridStep(), a=screenToWorld(0,h), b=screenToWorld(w,0);
 const x0=Math.floor(a.x/step)*step, x1=Math.ceil(b.x/step)*step;
 const y0=Math.floor(a.y/step)*step, y1=Math.ceil(b.y/step)*step;
 ctx.lineWidth=1;ctx.strokeStyle='#1b1b1b';
 for(let x=x0;x<=x1;x+=step){let p=worldToScreen({x,y:a.y}),q=worldToScreen({x,y:b.y});ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
 for(let y=y0;y<=y1;y+=step){let p=worldToScreen({x:a.x,y}),q=worldToScreen({x:b.x,y});ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
 ctx.strokeStyle='#303030';
 let ax=worldToScreen({x:0,y:a.y}),bx=worldToScreen({x:0,y:b.y});
 if(ax.x>=0&&ax.x<=w){ctx.beginPath();ctx.moveTo(ax.x,0);ctx.lineTo(ax.x,h);ctx.stroke()}
 let ay=worldToScreen({x:a.x,y:0}),by=worldToScreen({x:b.x,y:0});
 if(ay.y>=0&&ay.y<=h){ctx.beginPath();ctx.moveTo(0,ay.y);ctx.lineTo(w,ay.y);ctx.stroke()}
}
function drawObject(o){
 const selected=selectedObjects.includes(o)||o===selectedObject;
 if(!layers[layerOf(o)]||!layers[layerOf(o)].on)return;
 ctx.lineWidth=selected?3:1.7;
 ctx.strokeStyle=selected?'#00aaff':layerColor(o);
 ctx.fillStyle=selected?'#00aaff':layerColor(o);
 if(o.type==='POINT'){
   let p=worldToScreen(o.p);
   ctx.lineWidth=selected?2:1.5;
   ctx.beginPath();ctx.moveTo(p.x-7,p.y);ctx.lineTo(p.x+7,p.y);ctx.moveTo(p.x,p.y-7);ctx.lineTo(p.x,p.y+7);ctx.stroke();
   ctx.beginPath();ctx.arc(p.x,p.y,selected?4:2.5,0,Math.PI*2);ctx.fill();

function getSnapCandidate(raw){
  if(!settings.osnap)return null;
  let best=null,bestD=Math.max(12/view.scale,0.00001);
  for(const o of objects){
    const candidates=[];
    if(o.type==='LINE'){
      candidates.push({p:o.a,type:'ENDPOINT'},{p:o.b,type:'ENDPOINT'},
        {p:{x:(o.a.x+o.b.x)/2,y:(o.a.y+o.b.y)/2},type:'MIDPOINT'});
    }else if(o.type==='RECTANGLE'){
      const ps=[o.a,o.b,{x:o.a.x,y:o.b.y},{x:o.b.x,y:o.a.y}];
      for(let k=0;k<4;k++){
        const a=ps[k],b=ps[(k+1)%4];
        candidates.push({p:a,type:'ENDPOINT'},
          {p:{x:(a.x+b.x)/2,y:(a.y+b.y)/2},type:'MIDPOINT'});
      }
    }else if(o.type==='POLYLINE'){
      const pts=o.pts||[];
      for(let i=0;i<pts.length;i++) candidates.push({p:pts[i],type:'ENDPOINT'});
      for(let i=0;i<pts.length-1;i++) candidates.push({p:{x:(pts[i].x+pts[i+1].x)/2,y:(pts[i].y+pts[i+1].y)/2},type:'MIDPOINT'});
    }else if(o.type==='POINT'){
      candidates.push({p:o.p,type:'NODE'});
    }else if(o.type==='CIRCLE'){
      candidates.push({p:o.c,type:'CENTER'});
    }
    for(const item of candidates){
      const d=Math.hypot(item.p.x-raw.x,item.p.y-raw.y);
      if(d<bestD){bestD=d;best=item}
    }
  }
  const lines=objects.filter(o=>o.type==='LINE');
  for(let i=0;i<lines.length;i++)for(let j=i+1;j<lines.length;j++){
    const a=lines[i].a,b=lines[i].b,c=lines[j].a,d=lines[j].b;
    const den=(a.x-b.x)*(c.y-d.y)-(a.y-b.y)*(c.x-d.x);
    if(Math.abs(den)<1e-12)continue;
    const px=((a.x*b.y-a.y*b.x)*(c.x-d.x)-(a.x-b.x)*(c.x*d.y-c.y*d.x))/den;
    const py=((a.x*b.y-a.y*b.x)*(c.y-d.y)-(a.y-b.y)*(c.x*d.y-c.y*d.x))/den;
    const on=(v,a,b)=>v>=Math.min(a,b)-1e-9&&v<=Math.max(a,b)+1e-9;
    if(on(px,a.x,b.x)&&on(py,a.y,b.y)&&on(px,c.x,d.x)&&on(py,c.y,d.y)){
      const dd=Math.hypot(px-raw.x,py-raw.y);
      if(dd<bestD){bestD=dd;best={p:{x:px,y:py},type:'INTERSECTION'}}

function getPolarCandidate(raw){
  if(!settings.polar || !points.length || !['LINE','PLINE'].includes(command))return null;
  const a=points[points.length-1],dx=raw.x-a.x,dy=raw.y-a.y,dist=Math.hypot(dx,dy);
  if(dist<1e-12)return null;
  const rawDeg=Math.atan2(dy,dx)*180/Math.PI;
  const step=Math.max(1,settings.polarAngle||15);
  const nearest=Math.round(rawDeg/step)*step;
  const diff=Math.abs(((rawDeg-nearest+180)%360)-180);
  if(diff>7.5)return null;
  const rad=nearest*Math.PI/180;
  return {p:{x:a.x+dist*Math.cos(rad),y:a.y+dist*Math.sin(rad)},angle:((nearest%360)+360)%360};
}
function snapPoint(p){

  else { const pol=getPolarCandidate(q); if(pol) q={...pol.p}; }
  if(settings.snap){q.x=Math.round(q.x);q.y=Math.round(q.y)}

    const a=points[points.length-1],dx=q.x-a.x,dy=q.y-a.y;
    if(Math.abs(dx)>=Math.abs(dy))q.y=a.y;else q.x=a.x;

}

function hitTest(p){
  const tolerance=Math.max(10/view.scale,0.00001);

    const d=Math.hypot(p.x-o.p.x,p.y-o.p.y);
    if(d<bestD){bestD=d;best=o}
  }
  if(best)return best;
  for(const o of objects){
    let d=Infinity;
    if(o.type==='LINE'){
      const vx=o.b.x-o.a.x,vy=o.b.y-o.a.y,wx=p.x-o.a.x,wy=p.y-o.a.y;
      const t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/(vx*vx+vy*vy||1)));

    }else if(o.type==='POLYLINE'){
      const pts=o.pts||[];
      const edge=(a,b)=>{const vx=b.x-a.x,vy=b.y-a.y,wx=p.x-a.x,wy=p.y-a.y;const t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/(vx*vx+vy*vy||1)));return Math.hypot(p.x-(a.x+t*vx),p.y-(a.y+t*vy))};

      const y0=Math.min(o.a.y,o.b.y),y1=Math.max(o.a.y,o.b.y);

        const vx=bx-ax,vy=by-ay,wx=p.x-ax,wy=p.y-ay;
        const t=Math.max(0,Math.min(1,(wx*vx+wy*vy)/(vx*vx+vy*vy||1)));

    else if(o.type==='LEGEND'){const sw=(o.w||36)*(o.scale||1),sh=(o.h||24)*(o.scale||1),dx=Math.max(o.x-p.x,0,p.x-(o.x+sw)),dy=Math.max(o.y-p.y,0,p.y-(o.y+sh));d=Math.hypot(dx,dy);}
    if(d<bestD){bestD=d;best=o}
  }
  return best;

const activePointers=new Map();
let pinch=null;

function updatePinch(){
  if(activePointers.size!==2){pinch=null;return}
  const pts=[...activePointers.values()];
  const dx=pts[1].x-pts[0].x, dy=pts[1].y-pts[0].y;
  pinch={
    distance:Math.hypot(dx,dy),
    centerX:(pts[0].x+pts[1].x)/2,
    centerY:(pts[0].y+pts[1].y)/2,
    scale:view.scale,
    cx:view.cx,cy:view.cy
  };
}

canvas.addEventListener('pointermove',e=>{
  const r=canvas.getBoundingClientRect();
  mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;mouse.inside=true;
  activePointers.set(e.pointerId,{x:mouse.x,y:mouse.y});

  if(activePointers.size===2){
    if(!pinch) updatePinch();
    else{
      const pts=[...activePointers.values()];
      const dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y;
      const dist=Math.max(1,Math.hypot(dx,dy));
      const centerX=(pts[0].x+pts[1].x)/2,centerY=(pts[0].y+pts[1].y)/2;
      const before=screenToWorld(pinch.centerX,pinch.centerY);
      view.scale=Math.max(0.000001,Math.min(100000000,pinch.scale*(dist/pinch.distance)));
      const after=screenToWorld(centerX,centerY);
      view.cx+=before.x-after.x;
      view.cy+=before.y-after.y;
      mouse.x=centerX;mouse.y=centerY;
      const q=screenToWorld(mouse.x,mouse.y);
      coords.textContent=`X ${q.x.toFixed(2)}   Y ${q.y.toFixed(2)}`;
      draw();
      return;
    }
  } else if(activePointers.size===1 && canvas._pan){
    view.cx=canvas._pan.cx-(e.clientX-canvas._pan.x)/view.scale;
    view.cy=canvas._pan.cy+(e.clientY-canvas._pan.y)/view.scale;
  }

  const raw=screenToWorld(mouse.x,mouse.y);
  const q=mouseWorld();
  const magnet=getSnapCandidate(raw);
  coords.textContent=`X ${q.x.toFixed(2)}   Y ${q.y.toFixed(2)}${magnet?'  • '+magnet.type:''}`;
  draw();
});

canvas.addEventListener('pointerleave',()=>{mouse.inside=false;draw()});

  const r=canvas.getBoundingClientRect();

  window._lastPointerCtrl=!!(e.ctrlKey||e.metaKey||e.shiftKey);
  const wp=screenToWorld(e.clientX-r.left,e.clientY-r.top);
  if(!command){
    const o=hitTest(wp);
    if(e.ctrlKey||e.metaKey){if(o){if(selectedObjects.includes(o))selectedObjects=selectedObjects.filter(x=>x!==o);else selectedObjects.push(o);selectedObject=selectedObjects[0]||null;}}

    log.textContent=selectedObjects.length?(`${selectedObjects.length} object(s) selected`):'';
    draw();return;
  }
  handlePoint();
});

function addImportedPENZD(rows,sourceName){
  const imported=[];
  for(const row of rows){
    if(!row) continue;
    const P=row.P ?? row.p ?? row.Point ?? row.point ?? row[0];
    const E=row.E ?? row.e ?? row.Easting ?? row.easting ?? row[1];
    const N=row.N ?? row.n ?? row.Northing ?? row.northing ?? row[2];
    const Z=row.Z ?? row.z ?? row.Elevation ?? row.elevation ?? row[3] ?? 0;
    const D=row.D ?? row.d ?? row.Description ?? row.description ?? row[4] ?? '';
    if(P==null && E==null && N==null) continue;
    const ex=Number(String(E).replace(/,/g,'')), ny=Number(String(N).replace(/,/g,'')), zz=Number(String(Z??0).replace(/,/g,''));
    if(!Number.isFinite(ex)||!Number.isFinite(ny)) continue;
    imported.push({type:'POINT',p:{x:ex,y:ny},number:String(P??(imported.length+1)),z:Number.isFinite(zz)?zz:0,description:String(D??''),layer:currentLayer});
  }
  if(!imported.length){log.textContent='PENZD import: no valid P,E,N,Z,D rows found';return 0;}
  saveHistory(); objects.push(...imported); selectedObject=null; selectedObjects=[]; fitDrawing();
  log.textContent=`Imported ${imported.length} PENZD point(s) from ${sourceName}`;
  return imported.length;
}
function parsePENZDText(text){
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length)return [];
  let header=lines[0].split(/[\t,;]+/).map(x=>x.trim().toUpperCase());
  const hasHeader=header.includes('P')&&header.includes('E')&&header.includes('N');
  const start=hasHeader?1:0;
  const idx=hasHeader?{P:header.indexOf('P'),E:header.indexOf('E'),N:header.indexOf('N'),Z:header.indexOf('Z'),D:header.indexOf('D')}:{P:0,E:1,N:2,Z:3,D:4};
  return lines.slice(start).map(line=>{
    const a=line.split(/[\t,;]+/).map(x=>x.trim());
    return {P:a[idx.P],E:a[idx.E],N:a[idx.N],Z:idx.Z>=0?a[idx.Z]:0,D:idx.D>=0?a[idx.D]:''};
  });
}

const commandAliases={
  'L':'LINE','LINE':'LINE','PL':'PLINE','PLINE':'PLINE',
  'C':'CIRCLE','CIRCLE':'CIRCLE',
  'REC':'RECTANGLE','RECT':'RECTANGLE','RECTANGLE':'RECTANGLE',
  'PO':'POINT','P':'POINT','POINT':'POINT',
  'Z':'ZOOM','ZOOM':'ZOOM',
  'PAN':'PAN','PANN':'PAN',
  'U':'UNDO','UNDO':'UNDO',
  'F':'FIT','FIT':'FIT',
  'E':'END','END':'END','EP':'END PLINE','ER':'ERASE','ERASE':'ERASE','DEL':'ERASE','DELETE':'ERASE',
  'O':'ORTHO','ORTHO':'ORTHO',
  'OS':'OSNAP','OSNAP':'OSNAP',
  'SN':'SNAP','SNAP':'SNAP',
  'I':'IMPORT','IMPORT':'IMPORT',
  'M':'MOVE','MOVE':'MOVE','CO':'COPY','COPY':'COPY','RO':'ROTATE','ROTATE':'ROTATE','OF':'OFFSET','OFFSET':'OFFSET','TR':'TRIM','TRIM':'TRIM','D':'DIMENSION','DIM':'DIMENSION','DIST':'DIMENSION','DIMENSION':'DIMENSION',
  'EX':'EXPORT','EXPORT':'EXPORT',
  'ESC':'ESC','CANCEL':'ESC'
};
const commandHistory=[];
let historyIndex=-1;
function executeCommand(raw){
  const original=String(raw||'').trim().toUpperCase();
  if(!original)return;

  // AutoCAD-style command termination / multi-word command options.
  // E, END and EP terminate the active command; E PLINE / END PLINE
  // specifically commits the current polyline instead of erasing it.
  if(original==='E' || original==='END' || original==='EP' || original==='END PLINE' || original==='E PLINE' || original==='ENDPLINE'){
    if(command==='PLINE'){finishPline();log.textContent='PLINE ended';draw();}
    else finish();
    return;
  }

  const key=original;
  if(!key)return;
  commandHistory.unshift(key);
  if(commandHistory.length>30)commandHistory.pop();
  historyIndex=-1;
  const c=commandAliases[key]||key;
  if(c==='ESC'){finish();return}
  if(c==='END'){if(command==='PLINE')finishPline();else finish();return}
  if(c==='END PLINE'){if(command==='PLINE')finishPline();else finish();return}
  if(c==='ERASE'){if(selectedObjects.length){saveHistory();const set=new Set(selectedObjects);objects=objects.filter(o=>!set.has(o));selectedObjects=[];selectedObject=null;draw();log.textContent='Object(s) erased';}else{log.textContent='ERASE — Select object first'}return}
  if(c==='UNDO'){undo();return}
  if(c==='FIT'){fitDrawing();return}
  if(c==='IMPORT'){dxfFile.click();return}
  if(c==='EXPORT'){exportDXF();return}
  if(c==='ORTHO'||c==='OSNAP'||c==='SNAP'){ 
    const map={ORTHO:['orthoBtn','ortho'],OSNAP:['osnapBtn','osnap'],SNAP:['snapBtn','snap']};
    toggle(map[c][0],map[c][1]); return;
  }
  if(['LINE','PLINE','CIRCLE','RECTANGLE','POINT','ZOOM','PAN','MOVE','COPY','ROTATE','OFFSET','TRIM','DIMENSION'].includes(c)){
    setCommand(c);
    return;
  }
  log.textContent='Unknown command: '+key;
}
function plineInput(raw){
  const s=String(raw).trim().toUpperCase();if(command!=='PLINE')return false;
  if(s==='C'||s==='CLOSE')return plineClose();
  if(s==='E'||s==='END'||s==='EP'||s==='END PLINE'||s==='E PLINE')return finishPline();
  if(s==='U'||s==='UNDO')return plineUndo();
  if(!points.length)return false;
  const a=points.at(-1);let q=null,m=s.match(/^@?\s*(-?\d+(?:\.\d+)?)\s*<\s*(-?\d+(?:\.\d+)?)$/);
  if(m){const dist=parseFloat(m[1]),ang=parseFloat(m[2])*Math.PI/180;q={x:a.x+dist*Math.cos(ang),y:a.y+dist*Math.sin(ang)};}
  else{m=s.match(/^(@)?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);if(m){const x=parseFloat(m[2]),y=parseFloat(m[3]);q=m[1]?{x:a.x+x,y:a.y+y}:{x,y};}else if(/^-?\d+(?:\.\d+)?$/.test(s)){const dist=parseFloat(s),rawp=screenToWorld(mouse.x,mouse.y),ang=Math.atan2(rawp.y-a.y,rawp.x-a.x);q={x:a.x+dist*Math.cos(ang),y:a.y+dist*Math.sin(ang)};}}
  if(!q)return false;
  const pol=getPolarCandidate(q);if(pol&&!settings.ortho)q=pol.p;
  if(settings.ortho){const dx=q.x-a.x,dy=q.y-a.y;if(Math.abs(dx)>=Math.abs(dy))q.y=a.y;else q.x=a.x;}
  points.push(q);log.textContent='PLINE — Specify next point [Close/Undo]';draw();return true;
}
function lineInput(raw){
  const s=String(raw).trim().toUpperCase();
  if(command!=='LINE')return false;
  if(s==='C'||s==='CLOSE'){lineClose();return true}
  if(s==='U'||s==='UNDO'){lineUndo();return true}
  if(!points.length)return false;
  const a=points[points.length-1]; let q=null;
  let m=s.match(/^@?\s*(-?\d+(?:\.\d+)?)\s*<\s*(-?\d+(?:\.\d+)?)$/);
  if(m){
    const dist=parseFloat(m[1]),ang=parseFloat(m[2])*Math.PI/180;
    q={x:a.x+dist*Math.cos(ang),y:a.y+dist*Math.sin(ang)};
  }else{
    m=s.match(/^(@)?\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    if(m){
      const x=parseFloat(m[2]),y=parseFloat(m[3]); q=m[1]?{x:a.x+x,y:a.y+y}:{x,y};
    }else if(/^-?\d+(?:\.\d+)?$/.test(s)){
      const dist=parseFloat(s),rawp=screenToWorld(mouse.x,mouse.y);
      const ang=Math.atan2(rawp.y-a.y,rawp.x-a.x);
      q={x:a.x+dist*Math.cos(ang),y:a.y+dist*Math.sin(ang)};
    }
  }
  if(!q)return false;
  if(settings.ortho){
    const dx=q.x-a.x,dy=q.y-a.y;
    if(Math.abs(dx)>=Math.abs(dy))q.y=a.y;else q.x=a.x;
  }
  saveHistory();objects.push({type:'LINE',a,b:q,layer:currentLayer});points.push(q);lastLineEnd=q;
  log.textContent='LINE — Specify next point [Close/Undo]';draw();return true;
}
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const raw=input.value.trim(); input.value='';
    if(raw && /^(E|END|EP|END\s+PLINE|E\s+PLINE)$/i.test(raw)){
      executeCommand(raw);
      return;
    }
    if(command==='LINE'){
      if(!raw){
        if(!points.length && lastLineEnd){points=[lastLineEnd];lineStart=lastLineEnd;log.textContent='LINE — Continue from last endpoint';draw()}
        else if(points.length)finish();
        return;
      }
      if(lineInput(raw))return;
    }
    if(command==='PLINE'){
      if(!raw){if(points.length)finishPline();return;}
      if(plineInput(raw))return;
    }
    executeCommand(raw);
  }else if(e.key==='ArrowUp'){
    e.preventDefault(); if(commandHistory.length){historyIndex=Math.min(historyIndex+1,commandHistory.length-1);input.value=commandHistory[historyIndex]}
  }else if(e.key==='ArrowDown'){
    e.preventDefault(); historyIndex=Math.max(-1,historyIndex-1);input.value=historyIndex<0?'':commandHistory[historyIndex];
  }else if(e.key==='Escape'){input.value='';finish()}
});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){finish();return}
  if(document.activeElement===input)return;
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const k=e.key.toUpperCase();
  // Single-key CAD shortcuts execute immediately.
  if(commandAliases[k] && ['L','C','R','P','Z','U','F','E','O','I','M'].includes(k)){
    executeCommand(k);
  }else if(e.key==='Enter'){
    input.focus();
  }
});
